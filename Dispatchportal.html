<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Variant D — Dispatch Board | Dispatch Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-h);line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link,var(--primary))}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{flex:none;display:block}
.grow{flex:1}
.muted{color:var(--muted)}
.skip{position:absolute;left:-999px;top:8px;z-index:99;padding:10px 14px;background:var(--primary);color:var(--on-primary);border:0;border-radius:6px;font-weight:600}
.skip:focus{left:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid transparent;border-radius:var(--radius-sm);font-weight:600;font-size:14px;background:none;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--primary);color:var(--on-primary);min-height:44px}
.btn-ghost{border-color:var(--line-strong,var(--line));background:var(--field,var(--surface));color:var(--ink)}
.btn-danger{background:var(--danger);color:var(--on-danger,#fff);min-height:44px}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn-block{width:100%}
.btn[disabled],.pg[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:var(--radius-sm);background:none;color:var(--muted);position:relative;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:var(--on-danger,#fff);font-size:10px;font-weight:700;line-height:16px;text-align:center}

.input{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line-strong,var(--line));border-radius:var(--radius-sm);background:var(--field,var(--surface));color:var(--ink)}
.input::placeholder{color:var(--muted);opacity:1}
.input[aria-invalid=true]{border-color:var(--danger)}
select.input{padding-right:28px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search .input{padding-left:36px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-weight:600;font-size:13px}
.req{color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12.5px;color:var(--danger-ink,var(--danger));font-weight:500}
.err:empty{display:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar select.input{width:auto;min-width:150px}

.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:740px}
.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px var(--cell);white-space:nowrap}
.tbl td{padding:var(--rowpad) var(--cell);border-top:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-num,inherit)}
.tbl .code{font-family:var(--font-num,inherit);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.sel td{background:var(--sel)}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--hover)}
.tbl tbody tr.sel:hover td{background:var(--sel)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.cell-main{display:flex;gap:12px;align-items:center;min-width:0}
.cell-main b{display:block;font-weight:600}
.cell-main small{color:var(--muted);font-size:12px}
.tile{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--primary);font-weight:700;font-size:12px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--chip-bg);color:var(--chip-ink)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip-ok{--chip-bg:var(--ok-bg);--chip-ink:var(--ok)}
.chip-warn{--chip-bg:var(--warn-bg);--chip-ink:var(--warn)}
.chip-info{--chip-bg:var(--info-bg);--chip-ink:var(--info)}
.chip-off{--chip-bg:var(--off-bg);--chip-ink:var(--off)}
.switch{width:44px;height:24px;border-radius:999px;border:0;background:var(--switch-off);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:translate .15s}
.switch[aria-checked=true]{background:var(--switch-on,var(--primary))}
.switch[aria-checked=true]::after{translate:20px 0}
.pager{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px var(--cell);border-top:1px solid var(--line)}
.pager-info{color:var(--muted);font-size:13px}
.pager-btns{display:flex;gap:4px;align-items:center}
.pg{min-width:34px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--field,var(--surface));display:inline-grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.pg.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
.pg-gap{color:var(--muted);padding:0 4px}
.seg{display:inline-flex;padding:3px;border-radius:var(--radius-sm);background:var(--hover);gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:calc(var(--radius-sm) - 2px);font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--seg-on,var(--surface));color:var(--ink);box-shadow:var(--seg-shadow,none)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:56px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:16px}
.empty-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--primary)}

.sk{border-radius:6px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.sk-head{display:grid;gap:10px;margin-bottom:20px}
.sk-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.sk-tiles .sk{height:96px}
.sk-rows{display:grid;gap:16px;padding:20px}
.sk-row{display:grid;grid-template-columns:36px 2fr 1fr 1fr 80px;gap:16px;align-items:center}
.sk-row .sk{height:14px}
.sk-row .sk:first-child{height:36px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.ov{position:fixed;z-index:51;background:var(--surface-solid,var(--surface));color:var(--ink);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.ov-modal,.ov-confirm,.ov-wide{top:50%;left:50%;translate:-50% -50%;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);border-radius:var(--radius)}
.ov-confirm{width:min(430px,calc(100vw - 32px))}
.ov-wide{width:min(780px,calc(100vw - 32px))}
.ov-drawer{top:0;right:0;bottom:0;width:min(480px,100vw);padding-top:env(safe-area-inset-top,0px)}
.ov-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.ov-h h2{font-size:18px}
.ov-b{padding:24px;overflow:auto;flex:1}
.ov-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.pop-scrim{position:fixed;inset:0;z-index:59}
.pop{position:fixed;z-index:60;top:calc(var(--pop-top,64px) + env(safe-area-inset-top,0px));right:16px;width:min(340px,calc(100vw - 32px));background:var(--surface-solid,var(--surface));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:8px}
.pop h3{font-size:13px;padding:8px 10px;color:var(--muted);font-weight:600}
.pop-item{display:flex;gap:10px;width:100%;text-align:left;padding:10px;border:0;background:none;border-radius:var(--radius-sm);align-items:flex-start}
.pop-item:hover{background:var(--hover)}
.pop-item small{display:block;color:var(--muted);font-size:12px}
.pop-item svg{margin-top:2px;color:var(--muted)}
.toasts{position:fixed;z-index:70;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;width:min(380px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-solid,var(--surface));color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:tin .2s ease-out;font-weight:500}
.toast>svg{margin-top:2px}
.toast-ok>svg{color:var(--ok)}
.toast-err>svg{color:var(--danger)}
.toast .iconbtn{margin:-6px -6px -6px auto;width:32px;height:32px}
@keyframes tin{from{opacity:0;translate:0 8px}}

.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{position:relative;padding:0 0 22px 30px}
.tl li::before{content:"";position:absolute;left:4px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong,var(--line));background:var(--surface-solid,var(--surface))}
.tl li::after{content:"";position:absolute;left:9px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.done::after{background:var(--ok)}
.tl li.cur::before{border-color:var(--primary);box-shadow:0 0 0 4px var(--tint)}
.tl b{display:block;font-weight:600}
.tl small{color:var(--muted);font-size:12px}
.tl li.todo b{color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;list-style:none;padding:0;margin:0;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--grid);stroke-width:1}
.ch-axis{fill:var(--muted);font-size:11px;font-family:var(--font-num,var(--font))}
.ch-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-area{opacity:.1}
.ch-dot{stroke:var(--dot-ring,#fff);stroke-width:2}
.ch-val{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--font-num,var(--font))}
.ch-center{fill:var(--ink);font-family:var(--font-h);font-weight:700}
.ch-track{stroke:var(--grid)}
.meter{display:flex;gap:4px;margin-top:8px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line-strong,var(--line))}
.meter[data-s="1"] i:nth-child(-n+1){background:var(--danger)}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-s="3"] i:nth-child(-n+3){background:var(--info)}
.meter[data-s="4"] i{background:var(--ok)}
.prefs{list-style:none;margin:0;padding:0}
.prefs li{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.prefs li:first-child{border-top:0}
.prefs b{font-weight:600}
.prefs small{display:block;color:var(--muted);font-size:12.5px}
.avatar{display:grid;place-items:center;border-radius:50%;background:var(--avatar,var(--primary));color:var(--on-primary);font-weight:700;flex:none;width:34px;height:34px;font-size:12.5px}
.avatar.big{width:72px;height:72px;font-size:24px}
.captcha{display:flex;gap:8px;align-items:center}
.captcha-code{flex:none;user-select:none;letter-spacing:.3em;font:700 18px/1 var(--font-num,ui-monospace,monospace);padding:11px 10px 11px 16px;border-radius:var(--radius-sm);border:1px dashed var(--line-strong,var(--line));background:repeating-linear-gradient(-45deg,var(--hover) 0 6px,transparent 6px 12px);text-decoration:line-through;text-decoration-thickness:1px}
.pw{position:relative}
.pw .input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;translate:0 -50%;border:0;background:none;font-size:12px;font-weight:600;color:var(--link,var(--primary));padding:6px 8px;border-radius:6px}
.login-form{display:grid;gap:16px}
.login-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:4px 2px;color:var(--link,var(--primary));font-weight:600;text-decoration:underline;text-underline-offset:3px;border-radius:4px}
.demo-note{font-size:12.5px;color:var(--muted)}
.ed-bar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--line-strong,var(--line));border-bottom:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--hover)}
.ed-bar button{min-width:34px;height:34px;border:0;border-radius:6px;background:none;font-weight:700;display:inline-grid;place-items:center;padding:0 8px}
.ed-bar button:hover{background:var(--field,var(--surface))}
.ed-body{min-height:220px;padding:14px;border:1px solid var(--line-strong,var(--line));border-radius:0 0 var(--radius-sm) var(--radius-sm);background:var(--field,var(--surface));line-height:1.6;overflow:auto}
.ed-body:focus-visible{outline-offset:-2px}
.ed-body p{margin:0 0 10px}
.editor{display:grid;gap:16px;align-content:start}
.ed-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.nitem{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:4px 12px 4px 4px}
.nitem:first-child{border-top:0}
.nitem.on{background:var(--sel)}
.nitem-open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:10px 12px;border-radius:var(--radius-sm)}
.nitem-open b{display:block;font-weight:600}
.nitem-open small{color:var(--muted);font-size:12px}
.pcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pcard h3{font-size:18px}
.stack{display:grid;gap:16px}
.ucard-top{display:flex;gap:12px;align-items:center}
.ucard-top b{display:block;font-weight:600}
.ucard-top small{color:var(--muted);font-size:12px;word-break:break-all}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.sk-tiles{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--font-num,ui-monospace,SFMono-Regular,Menlo,monospace);font-variant-numeric:tabular-nums}
.upper{text-transform:uppercase}
.upper::placeholder{text-transform:none}
textarea.input{resize:vertical;min-height:64px}
.tag{display:inline-block;padding:1px 8px;border-radius:var(--radius-sm);border:1px solid var(--line-strong,var(--line));font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tbl small.sub{display:block;color:var(--muted);font-size:12px}
.mini{width:100%;border-collapse:collapse;font-size:13.5px}
.mini th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line-strong,var(--line))}
.mini td{padding:8px 6px;border-bottom:1px solid var(--line)}
.mini .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-num,inherit)}
.mini .tot td{font-weight:700;border-bottom:0}
.bar{width:120px;height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar.low i{background:var(--warn)}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--hover)}
.route small{display:block;color:var(--muted);font-size:12px}
.route b{display:block;font-weight:600;margin-bottom:4px}
.route-arrow{color:var(--primary)}
.qr{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);width:140px;aspect-ratio:1;flex:none;display:grid;place-items:center;color:#111}
.qr svg{width:100%;height:100%;display:block}
.qr-off{text-align:center;font-size:11px;gap:4px;color:#555;align-content:center}
.dsp-qr{display:flex;gap:16px;align-items:center}
.dsp-qr p small,.slip-qr p small{display:block;color:var(--muted);font-size:12px}
.dsp-qr p b,.slip-qr p b{font-size:16px;letter-spacing:.04em}
.dsp-info{display:grid;gap:14px}
.dsp-items h3,.dsp-track h3{font-size:13px;margin-bottom:10px}
.dsp-acts{justify-content:stretch}
.dsp-acts .btn{flex:1}
#nd-sum{display:grid;gap:14px}
.sum-items{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:13px}
.sum-items li{display:flex;justify-content:space-between;gap:12px}
.nd-hint,.nd-note{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:var(--radius-sm);background:var(--tint);color:var(--ink)}
.nd-hint svg,.nd-note svg{color:var(--primary);flex:none;margin-top:1px}
.nd-note{margin-top:16px}
.nd-stockof{margin-bottom:12px;color:var(--muted)}
.nd-stockof b{color:var(--ink)}
.nd-items{min-width:680px}
.input.qty{width:120px;text-align:right;min-height:36px;font-family:var(--font-num,inherit)}
.over{color:var(--danger-ink,var(--danger));font-weight:600;font-size:12.5px}
.nd-foot{display:flex;gap:10px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.rev-kv{margin-top:16px}
.slip-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:20px 24px;border-bottom:1px solid var(--line)}
.slip-top>div{flex:1;min-width:200px}
.slip-ok{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ok-bg);color:var(--ok);flex:none}
.slip-ok.warn{background:var(--warn-bg);color:var(--warn)}
.slip-l{color:var(--muted);font-size:13px}
.slip-no{font-size:28px;letter-spacing:.02em}
.slip-body{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:24px}
.slip-qr{display:grid;gap:12px;justify-items:start;align-content:start}
.slip-qr .qr{width:220px}
.slip-info{display:grid;gap:16px;align-content:start}
.slip-foot{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.viewfinder{position:relative;aspect-ratio:4/3;border-radius:var(--radius-sm);background:#0A0F1A;color:#C9D3E3;display:grid;place-items:end center;padding:14px;overflow:hidden;font-size:12.5px}
.viewfinder i{position:absolute;width:26px;height:26px;border:3px solid #fff;opacity:.9}
.viewfinder i:nth-child(1){left:18%;top:14%;border-right:0;border-bottom:0}
.viewfinder i:nth-child(2){right:18%;top:14%;border-left:0;border-bottom:0}
.viewfinder i:nth-child(3){left:18%;bottom:24%;border-right:0;border-top:0}
.viewfinder i:nth-child(4){right:18%;bottom:24%;border-left:0;border-top:0}
.vf-line{position:absolute;left:18%;right:18%;top:16%;height:2px;background:var(--vf,#34D399);box-shadow:0 0 12px var(--vf,#34D399);opacity:0}
.viewfinder.on .vf-line{opacity:1;animation:vf 1.1s ease-in-out infinite alternate}
@keyframes vf{to{top:72%}}

.ph-a{display:flex;gap:10px;flex-wrap:wrap}
.filters{margin-bottom:16px}
.only-sm{display:none}
.userbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 8px;border-radius:var(--radius-sm);text-align:left}

.userbtn-t b{display:block;font-size:13px;line-height:1.2}
.userbtn-t small{color:var(--muted);font-size:12px}
.cms{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:20px;align-items:start}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.prof-side{display:grid;gap:20px}
.pcard{padding:14px;border-radius:var(--radius-sm);background:var(--tint)}
.dsp-d{display:grid;gap:20px}
.dsp-detail{overflow:hidden}
.empty.compact{padding:28px 16px}

:root{
--font:"IBM Plex Sans","Noto Sans Devanagari",system-ui,sans-serif;--font-h:var(--font);--font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

body{color-scheme:light;font-size:14px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;color:var(--ink);line-height:1.2}
.d-top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.d-bar{display:flex;align-items:center;gap:12px;min-height:62px;padding:0 24px}
.d-nav{display:flex;gap:4px;padding:0 20px 8px;overflow-x:auto}
.dn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;color:var(--muted);font-weight:500;text-decoration:none;white-space:nowrap}
.dn:hover{background:var(--hover);color:var(--ink)}
.dn.on{background:var(--tint);color:var(--primary);font-weight:600}
.content{padding:24px;max-width:1560px;margin:0 auto;outline:0}
.btn{border-radius:6px}
.btn-primary:hover{background:#0B5662}
.btn-lg{min-height:52px;padding:0 24px;font-size:15px}
.tbl th{background:#F4F7F8;border-bottom:1px solid var(--line)}
.tbl td{border-top:0;border-bottom:1px solid var(--line)}
.chip{border-radius:5px}
.tag{border-radius:5px}
.count{min-width:26px;padding:1px 8px;border-radius:5px;background:#fff;border:1px solid var(--line-strong);font:600 12.5px var(--font-num);text-align:center}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.bcol{--tone:var(--line-strong);background:#E2E9EC;border-radius:12px;padding:12px;display:grid;gap:10px;border-top:4px solid var(--tone)}
.bcol-od{--tone:#C2410C}.bcol-tr{--tone:#0F6B7A}.bcol-ok{--tone:#1B6E3C}.bcol-sh{--tone:#B45309}
.bcol.drop{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--tint)}
.bcol header{display:flex;justify-content:space-between;align-items:center}
.bcol h2{font-size:15px}
.bcol-sub{color:var(--muted);font-size:12.5px;margin-top:-6px}
.bcards{display:grid;gap:8px}
.bempty{padding:18px 8px;text-align:center;color:var(--muted);font-size:13px}
.bcard{display:grid;gap:9px;text-align:left;padding:12px 12px 12px 14px;border:1px solid var(--line);border-left:5px solid var(--tone);border-radius:8px;background:#fff;width:100%}

.bc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.bc-route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;font-size:13px;line-height:1.3}
.bc-route svg{color:var(--muted)}
.bc-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.bmore{width:100%}
/* briefing */
.brief-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.brief-head h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
.brief-head p{color:var(--muted);margin-top:4px;font-size:15px}
.brief-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.att{grid-column:span 7}.month{grid-column:span 5}.trendc{grid-column:span 7}.flows{grid-column:span 5}
.card-h.sub{border-top:1px solid var(--line);background:#F4F7F8}

.alist small{display:block;color:var(--muted);font-size:12.5px}
.alist .bar{width:90px}
.late{color:#B4380A;font-weight:600;font-size:13px;white-space:nowrap}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist span{display:block;color:var(--muted);font-size:13px}
.mlist b{display:block;font:600 28px/1.15 var(--font-num)}
.mlist small{color:var(--muted);font-size:12.5px}
.flist{list-style:none;margin:0;padding:6px 18px 14px}
.flist li{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:12px;align-items:center;padding:9px 0;font-size:13.5px}
.flist .bar{width:auto;height:10px}
.flist b{text-align:right;font-weight:500}

.routebar{margin-bottom:18px}
.cart-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.cat-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cat-head h2{font-size:16px}

.cart{position:sticky;top:124px}

.stage{padding:20px;display:grid;gap:18px}

.ov-drawer .dsp-detail{border:0;border-radius:0}

.fd-link{display:flex;align-items:center;width:110px}
.fd-link i{flex:1;height:0;border-top:2px dashed var(--primary)}
.fd-qr{display:grid;place-items:center;width:48px;height:48px;border-radius:8px;background:#fff;border:2px solid var(--primary);color:var(--primary)}
@media(max-width:1200px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.att,.month,.trendc,.flows{grid-column:span 12}.cart-grid,.rv{grid-template-columns:1fr}.cart{position:static}}

function pager(k,total,per){const pages=Math.max(1,Math.ceil(total/per));const p=Math.min(Math.max(1,S[k]),pages);S[k]=p;const from=total?(p-1)*per+1:0,to=Math.min(total,p*per);
  const arr=[...new Set([1,pages,p-1,p,p+1].filter(n=>n>=1&&n<=pages))].sort((a,b)=>a-b);let nums='',prev=0;
  arr.forEach(n=>{if(n-prev>1)nums+='<span class="pg-gap">…</span>';nums+=`<button class="pg ${n===p?'on':''}" data-act="page" data-k="${k}" data-v="${n}" ${n===p?'aria-current="page"':''} aria-label="Page ${n}">${n}</button>`;prev=n});
  return `<nav class="pager" aria-label="Pagination"><span class="pager-info">Showing ${fmt(from)}–${fmt(to)} of ${fmt(total)}</span><div class="pager-btns"><button class="pg" data-act="page" data-k="${k}" data-v="${p-1}" ${p<=1?'disabled':''} aria-label="Previous page">${ic('chevL',16)}</button>${nums}<button class="pg" data-act="page" data-k="${k}" data-v="${p+1}" ${p>=pages?'disabled':''} aria-label="Next page">${ic('chevR',16)}</button></div></nav>`}

/* ---------- charts ---------- */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function lineChart({labels,series,w=720,h=260,area=true,label='Trend chart'}){
  const P={l:34,r:12,t:14,b:26},n=labels.length,max=niceMax(Math.max(...series.flatMap(s=>s.data))*1.05);
  const x=i=>P.l+i*(w-P.l-P.r)/(n-1),y=v=>P.t+(1-v/max)*(h-P.t-P.b);let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line class="ch-grid" x1="${P.l}" x2="${w-P.r}" y1="${yy}" y2="${yy}"/><text class="ch-axis" x="${P.l-8}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`}
  labels.forEach((l,i)=>{g+=`<text class="ch-axis" x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{let d=`M${x(0)},${y(s.data[0])}`;for(let i=1;i<n;i++){const dx=(x(i)-x(i-1))/2;d+=` C${x(i-1)+dx},${y(s.data[i-1])} ${x(i)-dx},${y(s.data[i])} ${x(i)},${y(s.data[i])}`}
    if(area)g+=`<path class="ch-area" style="fill:var(--${s.c})" d="${d} L${x(n-1)},${h-P.b} L${x(0)},${h-P.b} Z"/>`;
    g+=`<path class="ch-line" style="stroke:var(--${s.c})" d="${d}"/>`;
    s.data.forEach((v,i)=>{g+=`<circle class="ch-dot" style="fill:var(--${s.c})" cx="${x(i)}" cy="${y(v)}" r="4"><title>${s.name}, ${labels[i]}: ${v}</title></circle>`})});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${g}</svg>`}
function barChart({items,w=520,h=260,horizontal=false,c='c1',r=6,label='Bar chart'}){
  const max=niceMax(Math.max(...items.map(i=>i.value)));let g='';
  if(horizontal){const P={l:92,r:44,t:6,b:6},bh=(h-P.t-P.b)/items.length;
    items.forEach((it,i)=>{const yy=P.t+i*bh,bw=(w-P.l-P.r)*it.value/max;
      g+=`<text class="ch-axis" x="${P.l-10}" y="${yy+bh/2+4}" text-anchor="end">${it.label}</text><rect x="${P.l}" y="${yy+bh*.28}" width="${w-P.l-P.r}" height="${bh*.44}" rx="${r}" fill="var(--grid)"/><rect class="ch-bar" x="${P.l}" y="${yy+bh*.28}" width="${bw}" height="${bh*.44}" rx="${r}" style="fill:var(--${c})"><title>${it.label}: ${it.value}</title></rect><text class="ch-val" x="${P.l+bw+8}" y="${yy+bh/2+4}">${it.value}</text>`})}
  else{const P={l:34,r:8,t:22,b:26},bw=(w-P.l-P.r)/items.length,y=v=>P.t+(1-v/max)*(h-P.t-P.b);
    for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line class="ch-grid" x1="${P.l}" x2="${w-P.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-axis" x="${P.l-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
    items.forEach((it,i)=>{const xx=P.l+i*bw+bw*.22,ww=bw*.56,yy=y(it.value);
      g+=`<rect class="ch-bar" x="${xx}" y="${yy}" width="${ww}" height="${h-P.b-yy}" rx="${r}" style="fill:var(--${c})"><title>${it.label}: ${it.value}</title></rect><text class="ch-val" x="${xx+ww/2}" y="${yy-6}" text-anchor="middle">${it.value}</text><text class="ch-axis" x="${xx+ww/2}" y="${h-6}" text-anchor="middle">${it.label}</text>`})}
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${g}</svg>`}
function donut({segments,size=200,thick=26,centerTop,centerSub,label='Status chart'}){
  const r=(size-thick)/2,c=2*Math.PI*r,total=segments.reduce((a,s)=>a+s.value,0)||1;let off=0,g=`<circle class="ch-track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${thick}"/>`;
  segments.forEach(s=>{const len=c*s.value/total;g+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${thick}" style="stroke:var(--${s.c})" stroke-dasharray="${Math.max(0,len-2)} ${c-Math.max(0,len-2)}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${s.label}: ${s.value}</title></circle>`;off+=len});
  g+=`<text class="ch-center" x="${size/2}" y="${size/2+4}" text-anchor="middle" font-size="${size*.17}">${centerTop??total}</text><text class="ch-axis" x="${size/2}" y="${size/2+22}" text-anchor="middle">${centerSub||''}</text>`;
  return `<svg class="chart donut" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">${g}</svg>`}
function spark(data,c,w=120,h=36){const mn=Math.min(...data),mx=Math.max(...data),x=i=>2+i*(w-4)/(data.length-1),y=v=>h-4-(v-mn)/((mx-mn)||1)*(h-8);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline class="ch-line" style="stroke:var(--${c});stroke-width:2" points="${data.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/></svg>`}

function trend(){const n=S.range;return {labels:MLAB.slice(-n),series:[{name:'Dispatched',c:'c1',data:MCOUNT.slice(-n)},{name:'Received',c:'c2',data:MRECV.slice(-n)}]}}
function typeBars(){return TYPES.filter(x=>x!=='State').map(tp=>({label:TPLURAL[tp],value:dispatches.filter(d=>LOC[d.to].type===tp).length}))}
function statusSplit(){const recent=dispatches.filter(d=>d.mi===undefined||d.mi>=10);return [['Received','ok'],['In Transit','info'],['Short received','warn']].map(([l,c])=>({label:l==='In Transit'?'In transit':l,c,value:recent.filter(d=>d.status===l).length}))}
const notifs=()=>[
{icon:'clock',title:`${dispatches.filter(overdue).length} dispatches are past their delivery date`,sub:'Not yet received at the destination',route:'dispatch',k:'dstatus',v:'In Transit'},
{icon:'box',title:'3 items are running low at State Central Warehouse',sub:'Less than a third of total quantity remains',route:'items',k:'iloc',v:String(CWH.id)},
{icon:'megaphone',title:'2 notices are still in draft',sub:'Last edited 6 Nov 2026',route:'cms',k:'ntab',v:'draft'}];
