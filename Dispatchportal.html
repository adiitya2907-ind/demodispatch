  ${fld('lp',t('password'),`<div class="pw">${inp('lp','','type="password" autocomplete="current-password" required')}<button type="button" data-act="pwToggle" data-id="lp">Show</button></div>`,'',true)}
  ${fld('lc',t('captcha'),`<div class="captcha"><span class="captcha-code" aria-label="Verification code: ${S.cap.split('').join(' ')}">${S.cap}</span><button type="button" class="iconbtn" data-act="capRefresh" aria-label="Get a new code">${ic('refresh',18)}</button>${inp('lc','','autocomplete="off" autocapitalize="characters" maxlength="5" required')}</div>`,'',true)}
  <div class="login-row"><label class="check"><input type="checkbox" checked> Keep me signed in on this device</label><button type="button" class="linkbtn" data-act="forgot">${t('forgot')}</button></div>
  <button class="btn btn-primary btn-block" type="submit">${ic('lock',16)}${t('signin')}</button>
  <p class="demo-note">Demo sign-in: enter any username and password, then type the code shown.</p></form>`}
const langBtn=(cls='btn btn-ghost btn-sm')=>`<button type="button" class="${cls} lang" data-act="lang" aria-label="Switch language">${ic('globe',16)}<span>${t('other')}</span></button>`;

/* ---------- locations ---------- */
const PER=10;
function locRows(){const q=S.lq.trim().toLowerCase();return locations.filter(l=>(!S.ltype||l.type===S.ltype)&&(!S.lstatus||(S.lstatus==='Active')===l.active)&&(!q||(l.name+' '+l.code+' '+l.incharge).toLowerCase().includes(q)))}
function locRegion(){const all=locRows();if(!all.length)return `<div class="card">${empty('No locations match this search','Try a different name or code, or remove a filter.')}</div>`;
  const pg=pager('lpage',all.length,PER),rows=all.slice((S.lpage-1)*PER,S.lpage*PER),v=V.id,st=l=>chip(l.active?'Active':'Inactive'),par=l=>l.parent?esc(lname(l.parent)):'<span class="muted">Top level</span>';
  const acts=l=>v==='C'?`<div class="row-actions"><button class="btn btn-ghost btn-sm" data-act="editLoc" data-id="${l.id}">${ic('edit',14)}Edit</button><button class="btn btn-ghost btn-sm" data-act="delLoc" data-id="${l.id}">${ic('trash',14)}Delete</button></div>`:`<div class="row-actions"><button class="iconbtn" data-act="editLoc" data-id="${l.id}" aria-label="Edit ${esc(l.name)}">${ic('edit',16)}</button><button class="iconbtn" data-act="delLoc" data-id="${l.id}" aria-label="Delete ${esc(l.name)}">${ic('trash',16)}</button></div>`;
  let head,body;
  if(v==='A'){head='<th>Location</th><th>Type</th><th>Reports to</th><th>In-charge</th><th>Status</th><th><span class="sr-only">Actions</span></th>';
    body=rows.map(l=>`<tr><td><div class="cell-main"><span class="tile">${TPRE[l.type]}</span><div><b>${esc(l.name)}</b><small>${l.code}</small></div></div></td><td>${tag(l.type)}</td><td>${par(l)}</td><td>${esc(l.incharge)}</td><td>${st(l)}</td><td>${acts(l)}</td></tr>`).join('')}
  else if(v==='B'){head='<th>Code</th><th>Location</th><th>Type</th><th>Reports to</th><th>In-charge</th><th>Status</th><th><span class="sr-only">Actions</span></th>';
    body=rows.map(l=>`<tr><td class="code">${l.code}</td><td><b>${esc(l.name)}</b></td><td>${tag(l.type)}</td><td>${par(l)}</td><td>${esc(l.incharge)}</td><td>${st(l)}</td><td>${acts(l)}</td></tr>`).join('')}
  else{head='<th class="num">S. No.</th><th>Code</th><th>Location name</th><th>Type</th><th>Reports to</th><th>In-charge</th><th>Status</th><th>Actions</th>';
    body=rows.map((l,i)=>`<tr><td class="num">${(S.lpage-1)*PER+i+1}</td><td class="code">${l.code}</td><td><b>${esc(l.name)}</b></td><td>${l.type}</td><td>${par(l)}</td><td>${esc(l.incharge)}</td><td>${st(l)}</td><td>${acts(l)}</td></tr>`).join('')}
  return `<div class="card"><div class="table-wrap"><table class="tbl"><caption class="sr-only">Locations</caption><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${pg}</div>`}
function locationsScreen(){return `${V.head(t('locations'),`${fmt(locations.length)} locations: state, departments, districts, blocks, schools and warehouses`,`<button class="btn btn-primary" data-act="addLoc">${ic('plus',16)}Add location</button>`)}
  <div class="toolbar filters">${search('lq','Search by location name, code or in-charge')}${V.id==='B'?'':sel('ltype',[['','All types'],...TYPES],'Filter by type')}${sel('lstatus',[['','All statuses'],'Active','Inactive'],'Filter by status')}</div>
  <div id="region">${locRegion()}</div>`}
function locForm(l){const e=l||{};const body=`<form id="f-loc" novalidate data-id="${e.id||''}"><div class="form-grid">
  <div class="full">${fld('ln','Location name',inp('ln',e.name||'','required placeholder="East District, Block 5"'),'',true)}</div>
  ${fld('lt','Location type',fsel('lt',[['','Select a type'],...TYPES],e.type||''),'',true)}
  ${fld('lr','Reports to',`<select class="input" id="lr" name="lr">${locOpts(e.parent||HQ.id,e.id,'')}</select>`,'The parent location in the hierarchy.')}
  ${fld('li','In-charge',inp('li',e.incharge||'','placeholder="Full name"'))}
  ${fld('lx','Status',fsel('lx',['Active','Inactive'],e.active===false?'Inactive':'Active'))}
  </div></form>`;
  openOverlay(l?'Edit location':'Add location',body,`<button class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit" form="f-loc">${ic('check',16)}Save location</button>`,V.form.loc)}

/* ---------- items & stock ---------- */
function itemsRegion(){const q=S.iq.trim().toLowerCase(),rows=ITEMS.filter(i=>!q||(i.name+' '+i.code).toLowerCase().includes(q));if(!rows.length)return `<div class="card">${empty('No items match this search','Try a different item name or code.')}</div>`;
  return `<div class="card"><div class="table-wrap"><table class="tbl"><caption class="sr-only">Stock at ${esc(lname(S.iloc))}</caption><thead><tr><th>Item code</th><th>Item</th><th>Unit</th><th class="num">Total quantity</th><th class="num">Dispatched</th><th class="num">Remaining quantity</th><th>Stock level</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows.map(i=>{const s=stk(S.iloc,i.id),p=s.total?Math.round(s.rem/s.total*100):0;return `<tr><td class="code">${i.code}</td><td><b>${i.name}</b></td><td>${i.unit}</td><td class="num">${fmt(s.total)}</td><td class="num">${fmt(s.total-s.rem)}</td><td class="num"><b>${fmt(s.rem)}</b></td><td><div class="bar ${p<34?'low':''}" role="img" aria-label="${p}% remaining"><i style="width:${p}%"></i></div></td><td><div class="row-actions"><button class="btn btn-ghost btn-sm" data-act="newDispatch" data-from="${S.iloc}" ${s.rem?'':'disabled'}>${ic('truck',14)}Dispatch</button></div></td></tr>`}).join('')}</tbody></table></div></div>`}
function itemsScreen(){return `${V.head(t('items'),`Total and remaining quantity of each item at ${esc(lname(S.iloc))}`,`<button class="btn btn-primary" data-act="newDispatch" data-from="${S.iloc}">${ic('truck',16)}Dispatch from here</button>`)}
  <div class="toolbar filters">${search('iq','Search by item name or code')}<select class="input" data-model="iloc" aria-label="Location">${locOpts(S.iloc)}</select></div>
  <div id="region">${itemsRegion()}</div>`}

/* ---------- dispatch list ---------- */
function dispatchRows(){const q=S.dq.trim().toLowerCase();return dispatches.filter(d=>(!S.dstatus||d.status===S.dstatus)&&(!q||(d.id+' '+d.qr+' '+lname(d.from)+' '+lname(d.to)+' '+d.vehicle).toLowerCase().includes(q)))}
function timeline(d){const rec=d.status!=='In Transit';
  return `<ol class="tl"><li class="done"><b>Dispatch number and QR code generated</b><small>${dfmt(d.date)}</small></li><li class="done"><b>Left ${esc(lname(d.from))}</b><small>${dfmt(d.date)}, vehicle ${esc(d.vehicle)}</small></li><li class="${rec?'done':'cur'}"><b>In transit</b><small>${rec?'Completed':overdue(d)?'Past delivery date of '+dfmt(d.due):'Deliver by '+dfmt(d.due)}</small></li><li class="${rec?'done':'todo'}"><b>Received at ${esc(lname(d.to))}</b><small>${rec?`${dfmt(d.recvDate)}, by ${esc(d.recvBy)}`:'Waiting for QR scan at the destination'}</small></li></ol>`}
function dispatchDetail(d){const rec=d.status!=='In Transit';
  return `<aside class="card dsp-detail" aria-live="polite"><header class="card-h"><h2>${d.id}</h2>${chip(d.status)}</header><div class="card-b dsp-d">
  <div class="dsp-qr">${qrSvg(d)}<p><small>QR code no.</small><b class="mono">${d.qr}</b></p></div>
  <div class="dsp-info">${route(LOC[d.from],LOC[d.to])}<dl class="kv"><dt>Vehicle no.</dt><dd class="mono">${esc(d.vehicle)}</dd><dt>Driver</dt><dd>${esc(d.driver)}</dd><dt>Dispatched on</dt><dd>${dfmt(d.date)}</dd><dt>Deliver by</dt><dd>${dfmt(d.due)}</dd></dl></div>
  <div class="dsp-items"><h3>Items</h3><table class="mini"><thead><tr><th>Item</th><th class="num">Dispatched</th><th class="num">Received</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${IT[x.item].name}</td><td class="num">${fmt(x.qty)} ${IT[x.item].unit}</td><td class="num">${x.recv==null?'Pending':fmt(x.recv)}</td></tr>`).join('')}</tbody></table></div>
  <div class="dsp-track"><h3>Tracking</h3>${timeline(d)}</div>
  <div class="ed-foot dsp-acts"><button class="btn btn-ghost" data-act="print">${ic('printer',16)}Print slip</button>${rec?'':`<button class="btn btn-primary" data-act="toRecv" data-id="${d.id}">${ic('qr',16)}Receive this dispatch</button>`}</div></div></aside>`}
function dispatchRegion(){const all=dispatchRows(),per=8;if(!all.length)return `<div class="card">${empty('No dispatches match this search','Try a different dispatch no., QR code no. or location, or remove a filter.')}</div>`;
  const pg=pager('dpage',all.length,per),rows=all.slice((S.dpage-1)*per,S.dpage*per);let cur=rows.find(r=>r.id===S.sel)||rows[0];S.sel=cur.id;const A=V.id==='A';
  const body=rows.map(d=>`<tr class="${d.id===cur.id?'sel':''}" data-act="selDispatch" data-id="${d.id}"><td class="code"><button class="linkbtn" data-act="selDispatch" data-id="${d.id}" aria-label="Open ${d.id}">${d.id}</button></td>${A?`<td><b>${esc(lname(d.from))}</b><small class="sub">to ${esc(lname(d.to))}</small></td>`:`<td>${esc(lname(d.from))}</td><td>${esc(lname(d.to))}</td>`}<td class="num">${d.items.length} / ${fmt(units(d))}</td>${A?'':`<td class="code">${esc(d.vehicle)}</td>`}<td class="code">${dfmt(d.date)}</td><td>${chip(d.status)}${overdue(d)?' '+chip('Overdue'):''}</td></tr>`).join('');
  return `<div class="dsp"><div class="card dsp-table"><div class="table-wrap"><table class="tbl"><caption class="sr-only">Dispatches</caption><thead><tr><th>Dispatch no.</th>${A?'<th>From and to</th>':'<th>From</th><th>To</th>'}<th class="num">Items / qty</th>${A?'':'<th>Vehicle no.</th>'}<th>Dispatched on</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>${pg}</div>${dispatchDetail(cur)}</div>`}
function dispatchScreen(){return `${V.head(t('dispatch'),`${fmt(dispatches.length)} dispatches in the last 12 months. Select a row to see its QR code and tracking.`,`<button class="btn btn-primary" data-act="newDispatch">${ic('plus',16)}New dispatch</button>`)}
  <div class="toolbar filters">${search('dq','Search by dispatch no., QR code no., location or vehicle')}${V.id==='B'?'':seg('dstatus',[['','All'],['In Transit','In transit'],['Received','Received'],['Short received','Short received']])}</div>
  <div id="region">${dispatchRegion()}</div>`}

/* ---------- new dispatch ---------- */
const ND_STEPS=['From and to','Items and quantity','Vehicle and delivery','Check and generate'];
function ndTotals(){const n=S.nd,rows=ITEMS.filter(i=>(n.qty[i.id]|0)>0);return {rows,units:rows.reduce((a,i)=>a+n.qty[i.id],0)}}
function ndSummary(){const n=S.nd,{rows,units}=ndTotals();
  return `${route(LOC[n.from],LOC[n.to])}<dl class="kv"><dt>Items selected</dt><dd>${rows.length}</dd><dt>Total quantity</dt><dd>${fmt(units)}</dd><dt>Vehicle no.</dt><dd>${esc(n.vehicle.toUpperCase())||'Not entered'}</dd><dt>Deliver by</dt><dd>${n.due?dfmt(fromIso(n.due)):'Not entered'}</dd></dl>${rows.length?`<ul class="sum-items">${rows.map(i=>`<li><span>${i.name}</span><b>${fmt(n.qty[i.id])} ${i.unit}</b></li>`).join('')}</ul>`:''}`}
function partRoute(){const n=S.nd;return `<div class="form-grid">${fld('nd-from','From location',`<select class="input" id="nd-from" data-nd="from">${locOpts(n.from,null,'Select where the items leave from')}</select>`,'Any state, department, district, block, school or warehouse.',true)}${fld('nd-to','To location',`<select class="input" id="nd-to" data-nd="to">${locOpts(n.to,n.from,'Select where the items are delivered')}</select>`,'This location scans the QR code to receive the items.',true)}</div>`}
function partItems(){const n=S.nd;if(!n.from)return `<p class="nd-hint">${ic('pin',18)}Select the From location first. Its stock appears here.</p>`;
  return `<p class="nd-stockof">Stock at <b>${esc(lname(n.from))}</b></p><div class="table-wrap"><table class="tbl nd-items"><caption class="sr-only">Items available to dispatch</caption><thead><tr><th>Item</th><th class="num">Total quantity</th><th class="num">Remaining quantity</th><th class="num">Dispatch quantity</th><th class="num">Left after dispatch</th></tr></thead><tbody>${ITEMS.map(i=>{const s=stk(n.from,i.id),q=n.qty[i.id]||0;return `<tr><td><b>${i.name}</b><small class="sub">${i.code}, in ${i.unit.toLowerCase()}</small></td><td class="num">${fmt(s.total)}</td><td class="num"><b>${fmt(s.rem)}</b></td><td class="num"><input class="input qty" type="number" min="0" max="${s.rem}" step="1" inputmode="numeric" data-ndq="${i.id}" value="${q||''}" ${s.rem?'':'disabled'} aria-label="Dispatch quantity for ${i.name}" placeholder="${s.rem?'0':'No stock'}" ${q>s.rem?'aria-invalid="true"':''}></td><td class="num" data-left="${i.id}">${ndLeft(s.rem,q)}</td></tr>`}).join('')}</tbody></table></div><p class="err" id="nd-items-err" role="alert"></p>`}
const ndLeft=(rem,q)=>q>rem?`<span class="over">${fmt(q-rem)} more than remaining</span>`:fmt(rem-q);
function partTransport(){const n=S.nd;return `<div class="form-grid">
  ${fld('nd-vehicle','Vehicle no.',`<input class="input upper" id="nd-vehicle" data-nd="vehicle" value="${esc(n.vehicle)}" placeholder="XX 01 AB 1234" autocomplete="off">`,'',true)}
  ${fld('nd-due','Delivery date',`<input class="input" id="nd-due" type="date" data-nd="due" value="${n.due}" min="${iso(TODAY)}">`,'The date the items should reach the To location.',true)}
  ${fld('nd-driver','Driver name',`<input class="input" id="nd-driver" data-nd="driver" value="${esc(n.driver)}" autocomplete="off">`,'',true)}
  ${fld('nd-phone','Driver mobile number',`<input class="input" id="nd-phone" type="tel" inputmode="numeric" data-nd="phone" value="${esc(n.phone)}" placeholder="10-digit number">`)}
  <div class="full">${fld('nd-remarks','Remarks',`<textarea class="input" id="nd-remarks" rows="2" data-nd="remarks" placeholder="Seal number, handling notes or anything the receiver should know">${esc(n.remarks)}</textarea>`)}</div></div>`}
function partReview(){const n=S.nd,{rows,units}=ndTotals();return `${route(LOC[n.from],LOC[n.to])}<table class="mini"><thead><tr><th>Item</th><th class="num">Dispatch quantity</th><th class="num">Left at source</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${i.name}</td><td class="num">${fmt(n.qty[i.id])} ${i.unit}</td><td class="num">${fmt(stk(n.from,i.id).rem-n.qty[i.id])}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td class="num">${fmt(units)}</td><td></td></tr></tbody></table>
  <dl class="kv rev-kv"><dt>Vehicle no.</dt><dd class="mono">${esc(n.vehicle.toUpperCase())}</dd><dt>Driver</dt><dd>${esc(n.driver)}${n.phone?', '+esc(n.phone):''}</dd><dt>Deliver by</dt><dd>${n.due?dfmt(fromIso(n.due)):''}</dd>${n.remarks?`<dt>Remarks</dt><dd>${esc(n.remarks)}</dd>`:''}</dl>
  <p class="nd-note">${ic('qr',18)}Generating creates the dispatch number and its QR code, and reduces the remaining quantity at the From location.</p>`}
function ndFoot(){const s=S.nd.step;return `<div class="nd-foot">${s>1?`<button class="btn btn-ghost" data-act="ndBack">${ic('chevL',16)}Back</button>`:`<button class="btn btn-ghost" data-act="go" data-route="dispatch">Cancel</button>`}<span class="grow"></span>${s<4?`<button class="btn btn-primary" data-act="ndNext">Continue${ic('chevR',16)}</button>`:`<button class="btn btn-primary" data-act="ndCreate">${ic('qr',16)}Generate dispatch no. and QR code</button>`}</div>`}
function ndDone(d){return `<section class="card slip"><div class="slip-top"><span class="slip-ok">${ic('check',22)}</span><div><p class="slip-l">Dispatch number generated</p><h2 class="slip-no mono">${d.id}</h2></div>${chip('In Transit')}</div>
  <div class="slip-body"><div class="slip-qr">${qrSvg(d)}<p><small>QR code no.</small><b class="mono">${d.qr}</b></p><p class="hint">The receiving location scans this code, or types the QR code no. or dispatch no.</p></div>
  <div class="slip-info">${route(LOC[d.from],LOC[d.to])}<table class="mini"><thead><tr><th>Item</th><th class="num">Quantity</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${IT[x.item].name}</td><td class="num">${fmt(x.qty)} ${IT[x.item].unit}</td></tr>`).join('')}</tbody></table>
  <dl class="kv"><dt>Vehicle no.</dt><dd class="mono">${esc(d.vehicle)}</dd><dt>Driver</dt><dd>${esc(d.driver)}</dd><dt>Dispatched on</dt><dd>${dfmt(d.date)}</dd><dt>Deliver by</dt><dd>${dfmt(d.due)}</dd></dl></div></div>
  <footer class="slip-foot"><button class="btn btn-ghost" data-act="print">${ic('printer',16)}Print dispatch slip</button><button class="btn btn-ghost" data-act="newDispatch">${ic('plus',16)}Create another</button><span class="grow"></span><button class="btn btn-ghost" data-act="go" data-route="dispatch">View all dispatches</button><button class="btn btn-primary" data-act="toRecv" data-id="${d.id}">${ic('qr',16)}Receive this dispatch</button></footer></section>`}
function newDispatchScreen(){const n=S.nd;if(n.done){const d=dispatches.find(x=>x.id===n.done);if(d)return V.head('Dispatch created','Share the QR code with the vehicle. The receiving location needs it to accept the items.','')+ndDone(d)}
  return V.newDispatch({steps:ND_STEPS,step:n.step,parts:[partRoute,partItems,partTransport,partReview],summary:()=>V.ndSummary?V.ndSummary():ndSummary(),foot:ndFoot})}
function ndValid(step,show){const n=S.nd,errs=[],ids={1:['nd-from','nd-to'],2:['nd-items'],3:['nd-vehicle','nd-driver','nd-due']}[step]||[];
  if(step===1){if(!n.from)errs.push(['nd-from','Select the location the items leave from.']);if(!n.to)errs.push(['nd-to','Select the location receiving the items.']);else if(n.to==n.from)errs.push(['nd-to','From and To can’t be the same location.'])}
  if(step===2&&n.from){const over=ITEMS.filter(i=>(n.qty[i.id]||0)>stk(n.from,i.id).rem);if(over.length)errs.push(['nd-items',`Dispatch quantity is more than the remaining quantity for ${over.map(i=>i.name).join(', ')}.`]);else if(!ndTotals().rows.length)errs.push(['nd-items','Enter a dispatch quantity for at least one item.'])}
  if(step===3){if(n.vehicle.replace(/\s/g,'').length<4)errs.push(['nd-vehicle','Enter the vehicle number.']);if(!n.driver.trim())errs.push(['nd-driver','Enter the driver’s name.']);if(!n.due)errs.push(['nd-due','Choose the delivery date.']);else if(n.due<iso(TODAY))errs.push(['nd-due','Delivery date can’t be in the past.'])}
  if(show){ids.forEach(id=>setErr(id,''));errs.forEach(([id,m])=>setErr(id,m))}return errs}
function ndFocus(id){const el=id==='nd-items'?$('.nd-items .qty:not([disabled])'):$('#'+id);if(el){el.focus();el.scrollIntoView({block:'center',behavior:'smooth'})}}

/* ---------- receive ---------- */
function findDispatch(code){const c=String(code).trim().toUpperCase();if(!c)return null;const parts=c.split('|');return dispatches.find(d=>parts.includes(d.id)||parts.includes(d.qr))||null}
function rcvResult(){const r=S.rcv;
  if(r.done){const d=dispatches.find(x=>x.id===r.done);return `<header class="card-h"><h2>Receipt recorded</h2>${chip(d.status)}</header><div class="card-b rcv-done"><span class="slip-ok">${ic('check',22)}</span><h3>${d.id} received at ${esc(lname(d.to))}</h3><p class="muted">${dfmt(d.recvDate)}, by ${esc(d.recvBy)}. Stock at this location has been updated.</p><table class="mini"><thead><tr><th>Item</th><th class="num">Dispatched</th><th class="num">Received</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${IT[x.item].name}</td><td class="num">${fmt(x.qty)}</td><td class="num">${fmt(x.recv)}</td></tr>`).join('')}</tbody></table><div class="ed-foot"><button class="btn btn-ghost" data-act="go" data-route="dispatch">View all dispatches</button><button class="btn btn-primary" data-act="rcvClear">${ic('qr',16)}Receive another</button></div></div>`}
  if(r.found){const d=dispatches.find(x=>x.id===r.found);
    if(d.status!=='In Transit')return `<header class="card-h"><h2>${d.id}</h2>${chip(d.status)}</header><div class="card-b rcv-done"><span class="slip-ok warn">${ic('alert',22)}</span><h3>This dispatch was already received</h3><p class="muted">Received at ${esc(lname(d.to))} on ${dfmt(d.recvDate)} by ${esc(d.recvBy)}. It can’t be received twice.</p><div class="ed-foot"><button class="btn btn-primary" data-act="rcvClear">Try another code</button></div></div>`;
    return `<header class="card-h"><h2>${d.id}</h2>${chip(d.status)}${overdue(d)?chip('Overdue'):''}</header><div class="card-b stack">${route(LOC[d.from],LOC[d.to])}
    <dl class="kv rcv-kv"><dt>QR code no.</dt><dd class="mono">${d.qr}</dd><dt>Vehicle no.</dt><dd class="mono">${esc(d.vehicle)}</dd><dt>Driver</dt><dd>${esc(d.driver)}</dd><dt>Dispatched on</dt><dd>${dfmt(d.date)}</dd><dt>Deliver by</dt><dd>${dfmt(d.due)}</dd></dl>
    <div class="table-wrap"><table class="tbl rcv-items"><caption class="sr-only">Items in this dispatch</caption><thead><tr><th>Item</th><th>Unit</th><th class="num">Dispatched quantity</th><th class="num">Received quantity</th></tr></thead><tbody>${d.items.map(x=>`<tr><td><b>${IT[x.item].name}</b></td><td>${IT[x.item].unit}</td><td class="num">${fmt(x.qty)}</td><td class="num"><input class="input qty" type="number" min="0" max="${x.qty}" value="${x.qty}" data-rq="${x.item}" aria-label="Received quantity for ${IT[x.item].name}"></td></tr>`).join('')}</tbody></table></div><p class="err" id="rq-err" role="alert"></p>
    <div class="form-grid">${fld('rb','Received by',inp('rb',ME.name))}${fld('rr','Remarks',inp('rr','','placeholder="Note any shortage or damage"'))}</div>
    <div class="ed-foot"><button class="btn btn-ghost" data-act="rcvClear">Cancel</button><button class="btn btn-primary" data-act="rcvConfirm">${ic('check',16)}Confirm receipt</button></div></div>`}
  return `<header class="card-h"><h2>Dispatch details</h2></header><div class="empty"><span class="empty-ic">${ic('qr',26)}</span><h3>No dispatch selected yet</h3><p>Scan the QR code on the dispatch slip, or type the QR code no. or dispatch no. The items and quantities appear here to check and confirm.</p></div>`}
function receiveScreen(){const r=S.rcv,q=dispatches.filter(d=>d.status==='In Transit');
  return `${V.head('Receive a dispatch','Scan the QR code on the dispatch slip, or enter the QR code no. or dispatch no.','')}
  <div class="rcv"><section class="card rcv-scan"><header class="card-h"><h2>Scan QR code</h2></header><div class="card-b stack">
    <div class="viewfinder ${r.scanning?'on':''}" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="vf-line"></span><p>${r.scanning?'Reading QR code…':'Hold the QR code inside the frame'}</p></div>
    <button class="btn btn-primary btn-block" data-act="scan" ${r.scanning||!q.length?'disabled':''}>${ic('camera',16)}${r.scanning?'Scanning…':'Scan QR code'}</button>
    <p class="hint">Demo: the scan reads the QR code of the newest dispatch in transit.</p>
    <div class="or"><span>or enter the code</span></div>
    <form id="f-find" novalidate class="stack">${fld('rc','QR code no. or dispatch no.',`<input class="input upper mono" id="rc" name="rc" value="${esc(r.code)}" placeholder="QR7K2M9XPA or DN-2611-0381" autocomplete="off">`)}<button class="btn btn-ghost btn-block" type="submit">${ic('search',16)}Find dispatch</button></form></div></section>
  <section class="card rcv-result" id="rcv-result" aria-live="polite">${rcvResult()}</section>
  <section class="card rcv-queue"><header class="card-h"><h2>Awaiting receipt</h2><span class="count">${q.length}</span></header><div class="qlist">${q.slice(0,7).map(d=>`<button class="qitem" data-act="rcvPick" data-id="${d.id}"><span><b class="mono">${d.id}</b><small>${esc(lname(d.from))} to ${esc(lname(d.to))}</small></span>${overdue(d)?chip('Overdue'):`<small>by ${dfmt(d.due)}</small>`}</button>`).join('')||'<p class="muted qnone">Nothing is in transit.</p>'}</div></section></div>`}

/* ---------- users ---------- */
function userRows(){const q=S.uq.trim().toLowerCase();return users.filter(u=>(!S.urole||u.role===S.urole)&&(!q||(u.name+' '+u.email+' '+lname(u.loc)).toLowerCase().includes(q)))}
function usersRegion(){const all=userRows();if(!all.length)return `<div class="card">${empty('No users match this search','Try a different name or email, or choose another role.')}</div>`;
  const cards=V.usersLayout==='cards',per=cards?12:10,pg=pager('upage',all.length,per),rows=all.slice((S.upage-1)*per,S.upage*per);
  const tog=u=>sw(u.active,'toggleUser',u.id,`${u.name} is ${u.active?'active':'inactive'}`);
  if(cards)return `<div class="ucards">${rows.map(u=>`<article class="card ucard"><div class="ucard-top"><span class="avatar">${initials(u.name)}</span><div><b>${esc(u.name)}</b><small>${u.email}</small></div></div><dl class="kv"><dt>Role</dt><dd>${u.role}</dd><dt>Location</dt><dd>${esc(lname(u.loc))}</dd><dt>Last sign-in</dt><dd>${u.last}</dd></dl><footer class="ucard-foot">${chip(u.active?'Active':'Inactive')}${tog(u)}</footer></article>`).join('')}</div><div class="card pager-card">${pg}</div>`;
  return `<div class="card"><div class="table-wrap"><table class="tbl"><caption class="sr-only">Users</caption><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Location</th><th>Last sign-in</th><th>Status</th><th>Active</th></tr></thead><tbody>${rows.map(u=>`<tr><td><div class="cell-main"><span class="avatar">${initials(u.name)}</span><b>${esc(u.name)}</b></div></td><td class="code">${u.email}</td><td>${u.role}</td><td>${esc(lname(u.loc))}</td><td>${u.last}</td><td>${chip(u.active?'Active':'Inactive')}</td><td>${tog(u)}</td></tr>`).join('')}</tbody></table></div>${pg}</div>`}
function usersScreen(){return `${V.head(t('users'),`${users.filter(u=>u.active).length} of ${users.length} accounts are active`,`<button class="btn btn-primary" data-act="addUser">${ic('plus',16)}Add user</button>`)}
  <div class="toolbar filters">${search('uq','Search by name, email or location')}${V.id==='B'?'':sel('urole',[['','All roles'],...ROLES],'Filter by role')}</div>
  <div id="region">${usersRegion()}</div>`}
function userForm(){const body=`<form id="f-user" novalidate><div class="form-grid">
  <div class="full">${fld('un','Full name',inp('un','','required autocomplete="off"'),'',true)}</div>
  <div class="full">${fld('ue','Official email',inp('ue','','type="email" required placeholder="name@dispatch.example"'),'The sign-in link is sent here.',true)}</div>
  ${fld('ur','Role',fsel('ur',ROLES,'Dispatch Officer'))}
  ${fld('ud','Location',`<select class="input" id="ud" name="ud">${locOpts(HQ.id)}</select>`)}
  <label class="check full"><input type="checkbox" id="uw" checked> Send a welcome email with sign-in steps</label></div></form>`;
  openOverlay('Add user',body,`<button class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit" form="f-user">${ic('check',16)}Add user</button>`,V.form.user)}

/* ---------- notices ---------- */
function noticeRows(){return notices.filter(n=>!S.ntab||(S.ntab==='pub'?n.pub:!n.pub))}
function noticeList(){const rows=noticeRows();if(!rows.length)return `<div class="empty"><span class="empty-ic">${ic('inbox',26)}</span><h3>No notices here yet</h3><p>Start a new notice and it will appear in this list.</p></div>`;
  return rows.map(n=>`<div class="nitem ${n.id===S.nsel?'on':''}"><button class="nitem-open" data-act="nsel" data-id="${n.id}" ${n.id===S.nsel?'aria-current="true"':''}><b>${esc(n.title||'Untitled notice')}</b><small>${n.cat}, ${n.date}</small></button>${chip(n.pub?'Published':'Draft')}${sw(n.pub,'npub',n.id,`Publish “${n.title||'Untitled notice'}”`)}</div>`).join('')}
function cmsScreen(){const rows=noticeRows();let n=notices.find(x=>x.id===S.nsel&&rows.includes(x))||rows[0]||null;if(n)S.nsel=n.id;
  const editor=n?`<div class="editor">${fld('nt','Title',inp('nt',n.title,'placeholder="Notice title"'))}${fld('nc','Category',fsel('nc',NCATS,n.cat))}
    <div class="fld"><label id="nb-l">Notice text</label><div><div class="ed-bar" role="toolbar" aria-label="Formatting"><button type="button" data-act="ed" data-v="bold" aria-label="Bold">B</button><button type="button" data-act="ed" data-v="italic" aria-label="Italic"><i>I</i></button><button type="button" data-act="ed" data-v="underline" aria-label="Underline"><u>U</u></button><button type="button" data-act="ed" data-v="insertUnorderedList" aria-label="Bulleted list">${ic('list',16)}</button><button type="button" data-act="ed" data-v="createLink" aria-label="Add link">${ic('link',16)}</button></div><div class="ed-body" id="nb" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="nb-l">${n.body}</div></div></div>
    <div class="ed-foot"><span class="muted grow">${n.pub?'Visible to all portal users':'Only you and other admins can see this draft'}</span><button class="btn btn-ghost" data-act="nsave">Save draft</button><button class="btn btn-primary" data-act="npublish">${ic('megaphone',16)}Publish</button></div></div>`
   :`<div class="empty"><span class="empty-ic">${ic('megaphone',26)}</span><h3>Select a notice to edit</h3><p>Or start a new one.</p></div>`;
  return `${V.head(t('cms'),`${notices.filter(x=>x.pub).length} published, ${notices.filter(x=>!x.pub).length} in draft`,`<button class="btn btn-primary" data-act="nnew">${ic('plus',16)}New notice</button>`)}
  ${V.id==='B'?'':`<div class="toolbar filters">${seg('ntab',[['','All notices'],['pub','Published'],['draft','Drafts']])}</div>`}
  <div class="cms"><section class="card cms-list"><header class="card-h"><h2>Notices</h2></header><div id="region" class="nlist">${noticeList()}</div></section><section class="card cms-edit"><header class="card-h"><h2>${n?(n.pub?'Edit published notice':'Edit draft'):'Editor'}</h2>${n?chip(n.pub?'Published':'Draft'):''}</header><div class="card-b">${editor}</div></section></div>`}

/* ---------- profile ---------- */
function profileSecs(){return {
 profile:`<section class="card sec-profile" id="sec-profile"><header class="card-h"><h2>Profile</h2></header><div class="card-b stack"><div class="pcard"><span class="avatar big">${initials(ME.name)}</span><div><h3>${ME.name}</h3><p class="muted">State Admin, State Headquarters</p><p class="muted">${ME.email}</p></div></div>
   <form id="f-profile" novalidate><div class="form-grid">${fld('pn','Full name',inp('pn',ME.name))}${fld('pd','Designation',inp('pd','Deputy Director, Logistics'))}${fld('pm','Mobile number',inp('pm','','type="tel" placeholder="10-digit number"'),'Used for sign-in alerts.')}${fld('po','Location',inp('po','State Headquarters','disabled'))}<div class="full ed-foot"><button class="btn btn-primary" type="submit">${ic('check',16)}Save changes</button></div></div></form></div></section>`,
 security:`<section class="card sec-security" id="sec-security"><header class="card-h"><h2>Change password</h2></header><div class="card-b"><form id="f-pass" novalidate class="stack">
   ${fld('pc','Current password',`<div class="pw">${inp('pc','','type="password" autocomplete="current-password"')}<button type="button" data-act="pwToggle" data-id="pc">Show</button></div>`)}
   ${fld('p1','New password',`<div class="pw">${inp('p1','','type="password" autocomplete="new-password" data-pw')}<button type="button" data-act="pwToggle" data-id="p1">Show</button></div><div class="meter" id="pwm" data-s="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="hint" id="pwl" aria-live="polite">Use 8 or more characters with upper and lower case, a number and a symbol.</p>`)}
   ${fld('p2','Confirm new password',`<div class="pw">${inp('p2','','type="password" autocomplete="new-password"')}<button type="button" data-act="pwToggle" data-id="p2">Show</button></div>`)}
   <div class="ed-foot"><button class="btn btn-primary" type="submit">${ic('lock',16)}Change password</button></div></form></div></section>`,
 notify:`<section class="card sec-notify" id="sec-notify"><header class="card-h"><h2>Notification preferences</h2></header><div class="card-b"><ul class="prefs">
   ${[['email','Email me when a dispatch is created to my location','One email per dispatch, with its dispatch no.'],['sms','Text me when a dispatch is overdue','Sent when it is still in transit after its delivery date'],['weekly','Weekly summary','Every Monday at 9 am'],['notice','Tell me when a notice is published','Includes notices published by other admins']].map(([k,l,s])=>`<li><div><b>${l}</b><small>${s}</small></div>${sw(S.prefs[k],'pref',k,l)}</li>`).join('')}
   </ul><div class="ed-foot"><button class="btn btn-primary" data-act="savePrefs">${ic('check',16)}Save preferences</button></div></div></section>`}}
function profileScreen(){const s=profileSecs();const body=V.id==='B'?`<div class="prof prof-one">${s[S.ptab]||s.profile}</div>`:`<div class="prof">${s.profile}<div class="prof-side">${s.security}${s.notify}</div></div>`;
  return `${V.head(t('profile'),'Your account details, password and alerts','')}${body}`}
function pwScore(v){if(!v)return 0;if(v.length<8)return 1;let n=1;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))n++;if(/\d/.test(v))n++;if(/[^A-Za-z0-9]/.test(v))n++;return n}

/* ---------- screens / render ---------- */
function tabsFor(r){return {
 dashboard:{k:'range',items:[[12,'Last 12 months'],[6,'Last 6 months']]},
 locations:{k:'ltype',items:[['','All types'],...TYPES.map(x=>[x,TPLURAL[x]])]},
 items:{k:'_',items:[['','Stock register']]},
 dispatch:{k:'dstatus',items:[['','All dispatches'],['In Transit','In transit'],['Received','Received'],['Short received','Short received']]},
 'new-dispatch':{k:'_step',act:'ndStep',items:S.nd.done?[['x','Dispatch slip']]:ND_STEPS.map((l,i)=>[i+1,`${i+1}. ${l}`])},
 receive:{k:'_',items:[['','Scan or enter code']]},
 users:{k:'urole',items:[['','All roles'],...ROLES.map(x=>[x,x])]},
 cms:{k:'ntab',items:[['','All notices'],['pub','Published'],['draft','Drafts']]},
 profile:{k:'ptab',items:[['profile','Profile'],['security','Password'],['notify','Notifications']]}}[r]}
function topActions(){const n=notifs().length;return `${langBtn()}<button class="iconbtn" data-act="notif" aria-label="Notifications, ${n} new" aria-haspopup="true">${ic('bell',20)}<span class="badge">${n}</span></button><button class="userbtn" data-act="umenu" aria-haspopup="true"><span class="avatar">${initials(ME.name)}</span><span class="userbtn-t"><b>${ME.name}</b><small>State Admin</small></span>${ic('chevD',14)}</button>`}
function screen(){if(S.loading)return skeleton();if(V.screens&&V.screens[S.route])return V.screens[S.route]();switch(S.route){case 'locations':return locationsScreen();case 'items':return itemsScreen();case 'dispatch':return dispatchScreen();case 'new-dispatch':return newDispatchScreen();case 'receive':return receiveScreen();case 'users':return usersScreen();case 'cms':return cmsScreen();case 'profile':return profileScreen();default:return V.dashboard()}}
const sig=e=>[e.dataset.act,e.dataset.k||'',e.dataset.v||'',e.dataset.id||''].join('|');
function render(keep){const root=$('#app');
  if(!S.authed){root.innerHTML=V.login(loginForm());document.title=`${t('signin')} | ${t('portal')}`;return}
  root.innerHTML=V.shell(screen());document.title=`${t(S.route)} | ${t('portal')}`;
  if(keep){const el=keep[0]==='#'?$(keep):$$('[data-act]').find(e=>sig(e)===keep);if(el)el.focus({preventScroll:true})}}
const REG={locations:locRegion,items:itemsRegion,dispatch:dispatchRegion,users:usersRegion,cms:noticeList};
function refresh(keep){const r=$('#region');const RF=(V.regions&&V.regions[S.route])||REG[S.route];if(r&&RF){r.innerHTML=RF();if(keep){const el=$$('[data-act]',r).find(e=>sig(e)===keep);if(el)el.focus({preventScroll:true})}}else render(keep)}

/* ---------- routing ---------- */
let lt;
function enter(r){if(!ROUTES.includes(r))r='dashboard';if(!S.authed){S.next=r;render();return}
  S.route=r;S.navOpen=false;closeOv();S.loading=true;render();window.scrollTo(0,0);clearTimeout(lt);lt=setTimeout(()=>{S.loading=false;render();const c=$('#content');if(c)c.focus({preventScroll:true})},380)}
function go(r,patch){if(patch)Object.assign(S,patch,{lpage:1,dpage:1,upage:1});if(location.hash.slice(1)!==r)location.hash=r;else enter(r)}
window.addEventListener('hashchange',()=>enter(location.hash.slice(1)||'dashboard'));

/* ---------- overlays ---------- */
let lastFocus=null;
function openOverlay(title,body,foot,kind='modal'){lastFocus=document.activeElement;
  $('#overlay').innerHTML=`<div class="scrim" data-act="close"></div><section class="ov ov-${kind}" role="dialog" aria-modal="true" aria-labelledby="ovt"><header class="ov-h"><h2 id="ovt">${title}</h2><button class="iconbtn" data-act="close" aria-label="Close">${ic('x',18)}</button></header><div class="ov-b">${body}</div><footer class="ov-f">${foot}</footer></section>`;
  const f=$('#overlay .ov-b input:not([disabled]),#overlay .ov-b select,#overlay .ov-f .btn');if(f)f.focus()}
let onYes=null;
function confirmDlg(title,text,label,cb){lastFocus=document.activeElement;onYes=cb;
  $('#overlay').innerHTML=`<div class="scrim" data-act="close"></div><section class="ov ov-confirm" role="alertdialog" aria-modal="true" aria-labelledby="ovt" aria-describedby="ovd"><header class="ov-h"><h2 id="ovt">${title}</h2></header><div class="ov-b"><p id="ovd">${text}</p></div><footer class="ov-f"><button class="btn btn-ghost" data-act="close">Keep it</button><button class="btn btn-danger" data-act="yes">${ic('trash',16)}${label}</button></footer></section>`;
  $('#overlay .btn-ghost').focus()}
function openPop(html){lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="pop-scrim" data-act="close"></div><div class="pop" role="dialog" aria-label="Menu">${html}</div>`;const f=$('#overlay .pop button');if(f)f.focus()}
function closeOv(){const o=$('#overlay');if(o&&o.innerHTML){o.innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true})}}
function toast(msg,kind='ok'){const el=document.createElement('div');el.className=`toast toast-${kind}`;el.setAttribute('role',kind==='err'?'alert':'status');
  el.innerHTML=`${ic(kind==='err'?'alert':'check',18)}<span>${esc(msg)}</span><button class="iconbtn" aria-label="Dismiss" data-act="toastClose">${ic('x',14)}</button>`;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='err'?6000:3800)}
const setErr=(id,msg)=>{const e=$('#'+id+'-err'),i=$('#'+id);if(e)e.textContent=msg||'';if(i)i.setAttribute('aria-invalid',msg?'true':'false')};

/* ---------- actions ---------- */
const vact=n=>ACT[n]||(V.actions||{})[n];
const ACT={
 lang(){S.lang=S.lang==='en'?'hi':'en';document.documentElement.lang=S.lang;render('lang|||')},
 go(d){go(d.route,d.k?{[d.k]:d.v}:null);if(d.then)setTimeout(()=>{const f=vact(d.then);if(f)f({})},460)},
 set(d){if(d.k[0]==='_')return;S[d.k]=d.k==='range'?+d.v:d.v;S.lpage=S.dpage=S.upage=1;render(['set',d.k,d.v,''].join('|'))},
 page(d){S[d.k]=+d.v;refresh(['page',d.k,d.v,''].join('|'))},
 clear(){Object.assign(S,{lq:'',ltype:'',lstatus:'',iq:'',dq:'',dstatus:'',uq:'',urole:'',lpage:1,dpage:1,upage:1});render()},
 skip(){const c=$('#content');if(c)c.focus()},
 collapse(){S.collapsed=!S.collapsed;render('collapse|||')},
 navOpen(){S.navOpen=!S.navOpen;render('navOpen|||')},
 close(){closeOv()},
 yes(){const cb=onYes;onYes=null;closeOv();if(cb)cb()},
 toastClose(d,el){el.closest('.toast').remove()},
 print(){try{window.print()}catch(e){toast('Printing isn’t available in this preview.','err')}},
 capRefresh(){S.cap=genCap();const c=$('.captcha-code');if(c){c.textContent=S.cap;c.setAttribute('aria-label','Verification code: '+S.cap.split('').join(' '))}const i=$('#lc');if(i){i.value='';i.focus()}},
 pwToggle(d,el){const i=$('#'+d.id);if(!i)return;const show=i.type==='password';i.type=show?'text':'password';el.textContent=show?'Hide':'Show'},
 forgot(){openOverlay('Reset your password',`<form id="f-forgot" novalidate>${fld('fu','Username or official email',inp('fu','','required'),'We’ll send a reset link to the email registered for this account.',true)}</form>`,`<button class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit" form="f-forgot">Send reset link</button>`,'modal')},
 notif(){openPop(`<h3>Notifications</h3>${notifs().map(n=>`<button class="pop-item" data-act="go" data-route="${n.route}" data-k="${n.k}" data-v="${n.v}">${ic(n.icon,18)}<span><b>${n.title}</b><small>${n.sub}</small></span></button>`).join('')}`)},
 umenu(){openPop(`<h3>${ME.name}, State Admin</h3><button class="pop-item" data-act="go" data-route="profile">${ic('user',18)}<span>${t('profile')}</span></button><button class="pop-item" data-act="signout">${ic('logout',18)}<span>${t('signout')}</span></button>`)},
 signout(){closeOv();S.authed=false;S.cap=genCap();render();toast('Signed out')},
 addLoc(){locForm()},
 editLoc(d){locForm(LOC[d.id])},
 delLoc(d){const l=LOC[d.id];confirmDlg('Delete this location?',`${esc(l.name)} (${l.code}) will be removed and can no longer send or receive dispatches. This can’t be undone.`,'Delete location',()=>{locations.splice(locations.indexOf(l),1);refresh();toast('Location deleted')})},
 selDispatch(d){S.sel=d.id;refresh(['selDispatch','','',d.id].join('|'))},
 newDispatch(d){S.nd=blankNd();if(d&&d.from)S.nd.from=String(d.from);go('new-dispatch')},
 ndNext(){const s=S.nd.step,e=ndValid(s,true);if(e.length){ndFocus(e[0][0]);return}S.nd.step=Math.min(4,s+1);render();window.scrollTo(0,0);const h=$('#content');if(h)h.focus({preventScroll:true})},
 ndBack(){S.nd.step=Math.max(1,S.nd.step-1);render()},
 ndStep(d){const to=+d.v;if(!to||S.nd.done)return;for(let s=1;s<to;s++){if(ndValid(s,false).length){S.nd.step=s;render();const e=ndValid(s,true);ndFocus(e[0][0]);toast('Complete this step first.','err');return}}S.nd.step=to;render(['ndStep','',d.v,''].join('|'))},
 ndCreate(){const n=S.nd;let first=null;
   if(V.oneForm){[1,2,3].forEach(s=>{const e=ndValid(s,true);if(e.length&&!first)first=e[0][0]});if(first){ndFocus(first);toast('Dispatch not created. Check the fields marked in red.','err');return}}
   else for(let s=1;s<=3;s++){if(ndValid(s,false).length){S.nd.step=s;render();const e=ndValid(s,true);ndFocus(e[0][0]);return}}
   const {rows}=ndTotals(),seq=dispatches.length+1,d={date:new Date(TODAY),due:fromIso(n.due),from:+n.from,to:+n.to,items:rows.map(i=>({item:i.id,qty:n.qty[i.id],recv:null})),vehicle:n.vehicle.trim().toUpperCase(),driver:n.driver.trim(),phone:n.phone,status:'In Transit',qr:genQr(),recvDate:null,recvBy:null,remarks:n.remarks,id:dno(TODAY,seq)};
   rows.forEach(i=>{stk(d.from,i.id).rem-=n.qty[i.id]});dispatches.unshift(d);S.sel=d.id;S.dpage=1;
   activity.unshift({who:ME.name,what:`dispatched ${fmt(units(d))} units from ${lname(d.from)} to ${lname(d.to)}`,when:'Just now',icon:'truck'});
   n.done=d.id;render();window.scrollTo(0,0);toast(`Dispatch ${d.id} created`)},
 toRecv(d){S.rcv={found:d.id,done:null,err:'',scanning:false,code:d.id};go('receive')},
 scan(){const q=V.scanPool?V.scanPool():dispatches.filter(d=>d.status==='In Transit');if(!q.length)return;S.rcv={found:null,done:null,err:'',scanning:true,code:''};render();setTimeout(()=>{if(S.route!=='receive')return;S.rcv={found:q[0].id,done:null,err:'',scanning:false,code:q[0].qr};render();toast(`QR code read: ${q[0].qr}`)},1500)},
 rcvPick(d){S.rcv={found:d.id,done:null,err:'',scanning:false,code:d.id};render(['rcvPick','','',d.id].join('|'));const r=$('#rcv-result');if(r)r.scrollIntoView({block:'nearest',behavior:'smooth'})},
 rcvClear(){S.rcv={found:null,done:null,err:'',scanning:false,code:''};render();const i=$('#rc');if(i)i.focus()},
 rcvConfirm(){const d=dispatches.find(x=>x.id===S.rcv.found);if(!d)return;let bad=false;const vals={};$$('[data-rq]').forEach(i=>{const x=d.items.find(y=>y.item==i.dataset.rq),v=parseInt(i.value,10);const ok=Number.isInteger(v)&&v>=0&&v<=x.qty;i.setAttribute('aria-invalid',!ok);if(!ok)bad=true;vals[x.item]=v});
   if(bad){$('#rq-err').textContent='Received quantity must be between 0 and the dispatched quantity.';const b=$('[data-rq][aria-invalid=true]');if(b)b.focus();return}
   d.items.forEach(x=>{x.recv=vals[x.item];const s=stk(d.to,x.item);s.total+=x.recv;s.rem+=x.recv});d.status=d.items.every(x=>x.recv===x.qty)?'Received':'Short received';d.recvDate=new Date(TODAY);d.recvBy=$('#rb').value.trim()||ME.name;d.remarks=$('#rr').value;
   activity.unshift({who:d.recvBy,what:`received ${d.id} at ${lname(d.to)}`,when:'Just now',icon:'qr'});S.rcv={found:null,done:d.id,err:'',scanning:false,code:''};render();toast(d.status==='Received'?`${d.id} received in full`:`${d.id} received with a shortage`)},
 addUser(){userForm()},
 toggleUser(d){const u=users.find(x=>x.id==d.id);if(u.id===ME.id){toast('You can’t deactivate your own account. Ask another State Admin.','err');return}u.active=!u.active;refresh(['toggleUser','','',d.id].join('|'));toast(`${u.name} is now ${u.active?'active':'inactive'}`)},
 nsel(d){S.nsel=+d.id;render(['nsel','','',d.id].join('|'))},
 npub(d){const n=notices.find(x=>x.id==d.id);n.pub=!n.pub;render(['npub','','',d.id].join('|'));toast(n.pub?'Published':'Moved back to drafts')},
 nnew(){const id=Math.max(...notices.map(n=>n.id))+1;notices.unshift({id,title:'',cat:'Circulars',date:dfmt(TODAY),pub:false,body:'<p></p>'});S.ntab=S.ntab==='pub'?'':S.ntab;S.nsel=id;render();const i=$('#nt');if(i)i.focus()},
 nsave(){const n=readNotice();if(!n)return;n.pub=false;render('nsave|||');toast('Draft saved')},
 npublish(){const n=readNotice();if(!n)return;if(!n.title.trim()){setErr('nt','Add a title before publishing.');$('#nt').focus();return}n.pub=true;render('npublish|||');toast('Published')},
 ed(d){const b=$('#nb');if(!b)return;b.focus();if(d.v==='createLink'){const u=prompt('Link address','https://');if(u)document.execCommand('createLink',false,u)}else document.execCommand(d.v,false,null)},
 pref(d,el){S.prefs[d.id]=!S.prefs[d.id];el.setAttribute('aria-checked',S.prefs[d.id])},
 savePrefs(){toast('Preferences saved')}
};
function readNotice(){const n=notices.find(x=>x.id===S.nsel);if(!n)return null;n.title=$('#nt').value;n.cat=$('#nc').value;n.body=$('#nb').innerHTML;return n}

const SUBMIT={
 'f-login'(f){const u=f.lu.value.trim(),p=f.lp.value,c=f.lc.value.trim().toUpperCase();let ok=true;
   setErr('lu',u?'':'Enter your username.');setErr('lp',p?'':'Enter your password.');if(!u||!p)ok=false;
   if(c!==S.cap){setErr('lc',c?'That code doesn’t match. Try the new one.':'Type the code shown.');if(c){S.cap=genCap();const cc=$('.captcha-code');cc.textContent=S.cap;f.lc.value=''}ok=false}else setErr('lc','');
   if(!ok){const bad=$('[aria-invalid=true]',f);if(bad)bad.focus();return}
   S.authed=true;const r=S.next||location.hash.slice(1)||'dashboard';S.next=null;if(location.hash.slice(1)===r||!location.hash&&r==='dashboard')enter(r);else location.hash=r;toast(`Signed in as ${ME.name}`)},
 'f-forgot'(f){if(!f.fu.value.trim()){setErr('fu','Enter your username or email.');f.fu.focus();return}closeOv();toast('Reset link sent to the registered email')},
 'f-loc'(f){const name=f.ln.value.trim(),type=f.lt.value;setErr('ln',name?'':'Enter the location name.');setErr('lt',type?'':'Select a location type.');if(!name||!type){(name?f.lt:f.ln).focus();return}
   const id=f.dataset.id,parent=type==='State'?null:+f.lr.value||null;if(id){Object.assign(LOC[id],{name,type,parent,incharge:f.li.value.trim()||LOC[id].incharge,active:f.lx.value==='Active'})}
   else{tcount[type]=(tcount[type]||0)+1;const l={id:Math.max(...locations.map(x=>x.id))+1,code:`${TPRE[type]}-${String(tcount[type]).padStart(3,'0')}`,name,type,parent,incharge:f.li.value.trim()||'Not assigned',active:f.lx.value==='Active'};locations.unshift(l);LOC[l.id]=l;S.lpage=1}
   closeOv();refresh();toast('Location saved')},
 'f-find'(f){const code=f.rc.value.trim();S.rcv.code=code;if(!code){setErr('rc','Enter the QR code no. or dispatch no.');f.rc.focus();return}const d=findDispatch(code);
   if(!d){setErr('rc','No dispatch has this number. Check the slip and try again.');f.rc.focus();return}S.rcv={found:d.id,done:null,err:'',scanning:false,code};render();const r=$('#rcv-result');if(r)r.scrollIntoView({block:'nearest',behavior:'smooth'})},
 'f-user'(f){const name=f.un.value.trim(),em=f.ue.value.trim(),okEm=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em);setErr('un',name?'':'Enter the user’s full name.');setErr('ue',okEm?'':'Enter a valid email address.');if(!name||!okEm){(name?f.ue:f.un).focus();return}
   users.unshift({id:Math.max(...users.map(u=>u.id))+1,name,email:em,role:f.ur.value,loc:+f.ud.value,active:true,last:'Not signed in yet'});S.upage=1;closeOv();refresh();toast(`${name} added`)},
 'f-pass'(f){const c=f.pc.value,a=f.p1.value,b=f.p2.value;setErr('pc',c?'':'Enter your current password.');setErr('p1',pwScore(a)>=3?'':'Choose a stronger password: 8 or more characters with mixed case, a number or a symbol.');setErr('p2',a===b&&b?'':'The two new passwords don’t match.');
   if(!c||pwScore(a)<3||a!==b){toast('Password not changed. Check the fields marked in red.','err');const bad=$('[aria-invalid=true]',f);if(bad)bad.focus();return}f.reset();pwMeter('');toast('Password changed')},
 'f-profile'(f){ME.name=f.pn.value.trim()||ME.name;toast('Profile saved')}
};
function pwMeter(v){const s=pwScore(v),m=$('#pwm'),l=$('#pwl');if(m)m.dataset.s=s;if(l)l.textContent=['Use 8 or more characters with upper and lower case, a number and a symbol.','Too short: use at least 8 characters.','Weak: add upper and lower case letters, a number and a symbol.','Fair: add one more kind of character.','Strong password.'][s]}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
  if(!e.target.closest('.mega-item'))$$('.mega-item.open').forEach(m=>{m.classList.remove('open');const b=$('button',m);if(b)b.setAttribute('aria-expanded','false')});
  if(!el)return;if(el.tagName==='A')e.preventDefault();if(el.disabled)return;const fn=vact(el.dataset.act);if(fn){e.stopPropagation();fn(el.dataset,el)}});
document.addEventListener('submit',e=>{e.preventDefault();const fn=SUBMIT[e.target.id];if(fn)fn(e.target)});
document.addEventListener('input',e=>{const el=e.target,ds=el.dataset;
  if(ds.model&&el.tagName==='INPUT'){S[ds.model]=el.value;S.lpage=S.dpage=S.upage=1;refresh()}
  if('pw' in ds)pwMeter(el.value);
  if(ds.nd&&el.tagName!=='SELECT'){S.nd[ds.nd]=el.value;if(el.id)setErr(el.id,'');const s=$('#nd-sum');if(s)s.innerHTML=(V.ndSummary?V.ndSummary():ndSummary())}
  if(ds.ndq){const v=Math.max(0,parseInt(el.value,10)||0),rem=stk(S.nd.from,ds.ndq).rem;S.nd.qty[ds.ndq]=v;el.setAttribute('aria-invalid',v>rem);const c=$(`[data-left="${ds.ndq}"]`);if(c)c.innerHTML=ndLeft(rem,v);const s=$('#nd-sum');if(s)s.innerHTML=(V.ndSummary?V.ndSummary():ndSummary());const er=$('#nd-items-err');if(er)er.textContent=''}});
document.addEventListener('change',e=>{const el=e.target,ds=el.dataset;
  if(ds.model&&el.tagName==='SELECT'){S[ds.model]=el.value;S.lpage=S.dpage=S.upage=1;if(ds.model==='iloc')render();else refresh()}
  if(ds.nd&&el.tagName==='SELECT'){if(ds.nd==='from'&&S.nd.from!==el.value){S.nd.qty={};if(S.nd.to===el.value)S.nd.to=''}S.nd[ds.nd]=el.value;render('#nd-'+ds.nd)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#overlay').innerHTML)closeOv();else if(S.navOpen){S.navOpen=false;render()}}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter==='gsearch'){go('dispatch',{dq:e.target.value,dstatus:''})}
  if(e.key==='Tab'){const ov=$('#overlay .ov,#overlay .pop');if(ov){const f=$$('button:not([disabled]),input:not([disabled]),select,textarea,[contenteditable],a[href]',ov);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});

function start(){document.body.insertAdjacentHTML('beforeend','<div id="overlay"></div><div id="toasts" class="toasts" aria-live="polite"></div>');const h=location.hash.slice(1);if(ROUTES.includes(h))S.next=h;render()}

window.C={stk,ITEMS,IT,LOC,lname,locOpts,fld,ndLeft,ndTotals,ndSummary,units,overdue,findDispatch,rcvResult,dispatchDetail,qrSvg,route,tag,empty,pager,itemsRegion,TPRE,TPLURAL,iso,fromIso,addDays,notifs,timeline,sw,sel,search,partRoute,partTransport,openOverlay,closeOv,confirmDlg,setErr,genQr,$,$$,esc,fmt,ic,t,S,NAV,navOn,ROUTES,TYPES,ME,HQ,CWH,initials,locations,dispatches,users,notices,activity,chip,seg,card,kpis,trend,typeBars,statusSplit,lineChart,barChart,donut,spark,tabsFor,topActions,langBtn,go,render,toast,start,dfmt,TODAY,ACT};
})();

</script>
<script>
(function(){
const C=window.C,{ic,t,S,$,$$,esc,fmt}=C;
const mark=`<span class="mark">${ic('box',20)}</span>`;
const NAVD=[['dashboard','Dashboard','grid'],['dispatch','Board','truck'],['items','Stock','box'],['locations','Locations','pin'],['users','People','users'],['cms','Notices','megaphone']];
S.bshow={overdue:8,transit:8,received:8,short:8};S.bloc='';
const cols=[
 {k:'overdue',title:'Overdue',sub:'Past the delivery date',tone:'od',test:d=>C.overdue(d)},
 {k:'transit',title:'On the way',sub:'Due on or after today',tone:'tr',test:d=>d.status==='In Transit'&&!C.overdue(d)},
 {k:'received',title:'Received',sub:'Confirmed in full',tone:'ok',test:d=>d.status==='Received'},
 {k:'short',title:'Short received',sub:'Quantity differed',tone:'sh',test:d=>d.status==='Short received'}];
const visible=()=>({'':['overdue','transit','received','short'],'In Transit':['overdue','transit'],'Received':['received'],'Short received':['short']}[S.dstatus]||['overdue','transit','received','short']);
function rows(){const q=S.dq.trim().toLowerCase(),L=S.bloc;return C.dispatches.filter(d=>(!L||d.from==L||d.to==L)&&(!q||(d.id+' '+d.qr+' '+C.lname(d.from)+' '+C.lname(d.to)+' '+d.vehicle).toLowerCase().includes(q)))}
function card(d){const od=C.overdue(d),late=od?Math.max(1,Math.round((C.TODAY-d.due)/864e5)):0,transit=d.status==='In Transit';
 return `<button class="bcard" draggable="${transit}" data-act="openCard" data-id="${d.id}" data-card="${d.id}"><span class="bc-top"><b class="mono">${d.id}</b><span class="bc-due ${od?'late':''}">${transit?(od?late+(late>1?' days late':' day late'):'due '+C.dfmt(d.due)):'received '+C.dfmt(d.recvDate)}</span></span><span class="bc-route"><span>${esc(C.lname(d.from))}</span>${ic('arrowR',14)}<span>${esc(C.lname(d.to))}</span></span><span class="bc-meta"><span>${d.items.length} item${d.items.length>1?'s':''}, ${fmt(C.units(d))} units</span><span class="mono">${esc(d.vehicle)}</span></span></button>`}
function board(){const all=rows(),show=visible();
 return `<div class="board">${cols.filter(c=>show.includes(c.k)).map(c=>{const list=all.filter(c.test),n=S.bshow[c.k];
  return `<section class="bcol bcol-${c.tone}" data-col="${c.k}" aria-label="${c.title}"><header><h2>${c.title}</h2><span class="count">${list.length}</span></header><p class="bcol-sub">${c.sub}</p><div class="bcards">${list.slice(0,n).map(card).join('')||`<p class="bempty">Nothing here${S.dq||S.bloc?' for this search':''}.</p>`}</div>${list.length>n?`<button class="btn btn-ghost btn-sm bmore" data-act="bMore" data-id="${c.k}">Show ${Math.min(8,list.length-n)} more (${list.length-n} left)</button>`:''}</section>`}).join('')}</div>`}

/* drag and drop: drop an on-the-way card on Received to start receiving it */
let dragId=null;
document.addEventListener('dragstart',e=>{const b=e.target.closest&&e.target.closest('[data-card]');if(!b)return;dragId=b.dataset.card;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';b.classList.add('drag')});
document.addEventListener('dragend',()=>{dragId=null;$$('.drag,.drop').forEach(x=>x.classList.remove('drag','drop'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c&&dragId){e.preventDefault();c.classList.add('drop')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drop')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(!c||!dragId)return;e.preventDefault();const id=dragId;dragId=null;c.classList.remove('drop');
 const d=C.dispatches.find(x=>x.id===id);if(!d)return;
 if(['received','short'].includes(c.dataset.col)){if(d.status!=='In Transit'){C.toast(`${d.id} is already received.`,'err');return}V.actions.receiveSheet({id})}
 else C.toast('A dispatch moves forward only when the destination confirms receipt. Drop it on Received.','err')});
/* cart tiles: highlight when quantity entered, filter by name */
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.ndq){const t2=el.closest('.tile2');if(t2)t2.classList.toggle('on',(parseInt(el.value,10)||0)>0)}
 if(el.id==='cat-q'){const q=el.value.trim().toLowerCase();$$('.tile2').forEach(x=>x.hidden=!!q&&!x.dataset.name.includes(q))}});

window.V={id:'D',oneForm:true,form:{loc:'modal',user:'modal'},usersLayout:'table',
actions:{
 openCard(d){const x=C.dispatches.find(y=>y.id===d.id);if(!x)return;S.sel=x.id;C.openOverlay(x.id,C.dispatchDetail(x),'<button class="btn btn-ghost" data-act="close">Close</button>','drawer')},
 bMore(d){S.bshow[d.id]+=8;const r=$('#region');if(r)r.innerHTML=board()},
 receiveSheet(d){S.rcv={found:d.id,done:null,err:'',scanning:false,code:d.id};
  const html=C.rcvResult().replace('data-act="rcvConfirm"','data-act="sheetConfirm"').replace(/data-act="rcvClear"/g,'data-act="close"');
  C.openOverlay('Receive dispatch',`<section class="card sheetcard">${html}</section>`,'<button class="btn btn-ghost" data-act="close">Close</button>','wide')},
 sheetConfirm(){C.ACT.rcvConfirm();if(S.rcv.done){C.closeOv();S.rcv={found:null,done:null,err:'',scanning:false,code:''}}},
 qtyStep(d){const i=$(`[data-ndq="${d.id}"]`);if(!i)return;const rem=C.stk(S.nd.from,d.id).rem;let v=parseInt(i.value,10)||0;
  v=d.v==='max'?rem:d.v==='clear'?0:Math.min(rem,Math.max(0,v+Number(d.v)));i.value=v||'';i.dispatchEvent(new Event('input',{bubbles:true}))}},
regions:{dispatch:board},
login(form){return `<div class="lg"><section class="lg-form"><div class="lg-box"><div class="brand lgb">${mark}<span>${t('portal')}</span></div><div class="lg-top"><h1>${t('signin')}</h1>${C.langBtn()}</div><p class="muted lg-sub">${t('dept')}</p>${form}</div></section>
  <aside class="lg-art" aria-hidden="true"><div class="flowdiag"><div class="fd-node"><span>${ic('box',22)}</span><b>State Central Warehouse</b><small>Dispatch</small></div><div class="fd-link"><i></i><span class="fd-qr">${ic('qr',26)}</span><i></i></div><div class="fd-node"><span>${ic('pin',22)}</span><b>Government School, Ward 12</b><small>Receive</small></div></div><p>Every dispatch gets a number and a QR code. The receiving location scans it to confirm what arrived.</p></aside></div>`},
shell(inner){const nav=NAVD.map(([r,l,i])=>`<a class="dn ${C.navOn(r)?'on':''}" href="#${r}" ${C.navOn(r)?'aria-current="page"':''}>${ic(i,16)}<span>${l}</span></a>`).join('');
  return `<div class="d-app"><button class="skip" data-act="skip">Skip to content</button>
  <header class="d-top"><div class="d-bar"><a class="brand" href="#dashboard">${mark}<span>${t('portal')}</span></a><div class="search gsearch">${ic('search',16)}<input class="input" type="search" placeholder="Search dispatch no., QR code or location" aria-label="Search dispatches" data-enter="gsearch"></div><span class="grow"></span><a class="btn btn-ghost" href="#receive">${ic('qr',16)}Scan</a><button class="btn btn-primary" data-act="newDispatch">${ic('plus',16)}New dispatch</button>${C.topActions()}</div><nav class="d-nav" aria-label="Main">${nav}</nav></header>
  <main id="content" class="content" tabindex="-1">${inner}</main></div>`},
head(title,sub,actions){return `<div class="ph"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="ph-a">${actions||''}</div></div>`},
screens:{
 dispatch(){return `${V.head('Dispatch board',`${fmt(C.dispatches.length)} dispatches in the last 12 months. Open a card for its QR code, or drag an on-the-way card to Received.`,'')}
  <div class="toolbar filters">${C.search('dq','Search dispatch no., QR code no., location or vehicle')}<select class="input" data-model="bloc" aria-label="Filter by location"><option value="">All locations</option>${C.locOpts(S.bloc)}</select>${C.seg('dstatus',[['','All'],['In Transit','In transit'],['Received','Received'],['Short received','Short received']])}</div><div id="region">${board()}</div>`},
 receive(){const r=S.rcv,q=C.dispatches.filter(d=>d.status==='In Transit'),open=r.found||r.done;
  return `${V.head('Receive a dispatch','Scan the QR code on the slip, or type the QR code no. or dispatch no.','')}
  <div class="rv"><section class="card stage"><div class="viewfinder big ${r.scanning?'on':''}" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="vf-line"></span><p>${r.scanning?'Reading QR code…':'Hold the QR code inside the frame'}</p></div>
   <div class="stage-act"><button class="btn btn-primary btn-lg" data-act="scan" ${r.scanning||!q.length?'disabled':''}>${ic('camera',18)}${r.scanning?'Scanning…':'Scan QR code'}</button>
   <form id="f-find" novalidate class="find"><div class="fld"><label for="rc" class="sr-only">QR code no. or dispatch no.</label><input class="input upper mono" id="rc" name="rc" value="${esc(r.code)}" placeholder="Or type the QR code no. or dispatch no." autocomplete="off"><p class="err" id="rc-err" role="alert"></p></div><button class="btn btn-ghost" type="submit">${ic('search',16)}Find</button></form></div></section>
  <section class="rq"><h2>Waiting to be received <span class="count">${q.length}</span></h2><div class="qgrid">${q.slice(0,8).map(d=>`<button class="qcard" data-act="rcvPick" data-id="${d.id}"><b class="mono">${d.id}</b><span>${esc(C.lname(d.from))} to ${esc(C.lname(d.to))}</span>${C.overdue(d)?C.chip('Overdue'):`<small>by ${C.dfmt(d.due)}</small>`}</button>`).join('')}</div></section></div>
  ${open?`<div class="sheet-scrim" data-act="rcvClear"></div><aside class="sheet card" id="rcv-result" aria-live="polite"><button class="iconbtn sheet-x" data-act="rcvClear" aria-label="Close">${ic('x',18)}</button>${C.rcvResult()}</aside>`:''}`}},
ndSummary(){const n=S.nd,{rows,units}=C.ndTotals();
  if(!rows.length)return `<p class="cart-empty">${ic('box',22)}<span>The cart is empty. Enter a quantity on any item to add it.</span></p>`;
  return `<ul class="cart-lines">${rows.map(i=>`<li><span><b>${i.name}</b><small>${fmt(n.qty[i.id])} ${i.unit.toLowerCase()}</small></span><button class="iconbtn" data-act="qtyStep" data-id="${i.id}" data-v="clear" aria-label="Remove ${i.name}">${ic('x',14)}</button></li>`).join('')}</ul><dl class="kv cart-tot"><dt>Items</dt><dd>${rows.length}</dd><dt>Total quantity</dt><dd>${fmt(units)}</dd></dl>`},
newDispatch({summary}){const n=S.nd;
  const tiles=!n.from?`<p class="nd-hint">${ic('pin',18)}Choose the From location above. Its stock appears here as items you can add to the cart.</p>`:
   `<div class="tiles nd-items">${C.ITEMS.map(i=>{const s=C.stk(n.from,i.id),q=n.qty[i.id]||0,p=s.total?Math.round(s.rem/s.total*100):0,dis=s.rem?'':'disabled';
    return `<div class="tile2 ${q>0?'on':''} ${s.rem?'':'out'}" data-name="${esc(i.name.toLowerCase())}"><div class="t2-top"><b>${i.name}</b><small class="mono">${i.code}</small></div><div class="t2-stock"><b class="mono">${fmt(s.rem)}</b><span>remaining of ${fmt(s.total)} ${i.unit.toLowerCase()}</span></div><div class="bar ${p<34?'low':''}" role="img" aria-label="${p}% remaining"><i style="width:${p}%"></i></div>
    <div class="stepper"><button type="button" class="iconbtn" data-act="qtyStep" data-id="${i.id}" data-v="-10" aria-label="Decrease ${i.name} by 10" ${dis}>−</button><input class="input qty" type="number" min="0" max="${s.rem}" step="1" inputmode="numeric" data-ndq="${i.id}" value="${q||''}" placeholder="${s.rem?'0':'None'}" ${dis} aria-label="Dispatch quantity for ${i.name}"><button type="button" class="iconbtn" data-act="qtyStep" data-id="${i.id}" data-v="10" aria-label="Increase ${i.name} by 10" ${dis}>+</button><button type="button" class="linkbtn" data-act="qtyStep" data-id="${i.id}" data-v="max" ${dis}>All</button></div>
    <p class="t2-left">After dispatch: <b class="mono" data-left="${i.id}">${C.ndLeft(s.rem,q)}</b></p></div>`}).join('')}</div>`;
  return `${V.head('New dispatch','Choose where it goes, add items to the cart, then generate the dispatch number and QR code.','')}
  <section class="card routebar"><div class="card-b">${C.partRoute()}</div></section>
  <div class="cart-grid"><section><div class="cat-head"><h2>${n.from?'Items at '+esc(C.lname(n.from)):'Items'}</h2><div class="search">${ic('search',16)}<input class="input" id="cat-q" type="search" placeholder="Filter items" aria-label="Filter items"></div></div>${tiles}<p class="err" id="nd-items-err" role="alert"></p></section>
  <aside class="card cart"><header class="card-h"><h2>Dispatch cart</h2></header><div class="card-b"><div id="nd-sum">${summary()}</div><div class="cart-fields"><h3>Vehicle and delivery</h3>${C.partTransport()}</div></div><div class="cart-foot"><button class="btn btn-ghost" data-act="go" data-route="dispatch">Cancel</button><button class="btn btn-primary grow" data-act="ndCreate">${ic('qr',16)}Generate dispatch no. and QR code</button></div></aside></div>`},
dashboard(){const D=C.dispatches,od=D.filter(C.overdue).sort((a,b)=>a.due-b.due),tr=D.filter(d=>d.status==='In Transit'),ks=C.kpis(),low=[];
  C.locations.forEach(l=>{if(l.type!=='Warehouse')return;C.ITEMS.forEach(i=>{const s=C.stk(l.id,i.id);if(s.total&&s.rem/s.total<.34)low.push({l,i,s,p:s.rem/s.total})})});low.sort((a,b)=>a.p-b.p);
  const fl={};D.forEach(d=>{const k=C.LOC[d.from].type+' to '+C.LOC[d.to].type;fl[k]=(fl[k]||0)+1});const fls=Object.entries(fl).sort((a,b)=>b[1]-a[1]).slice(0,6),fmax=fls[0][1],tt=C.trend();
  return `<div class="brief-head"><div><h1>${od.length} dispatches need attention</h1><p>${tr.length} are on the road and ${od.length} are past their delivery date. Monday, 16 November 2026.</p></div><div class="ph-a"><button class="btn btn-ghost" data-act="go" data-route="dispatch">Open the board</button></div></div>
  <div class="brief-grid">
   <section class="card att"><header class="card-h"><h2>Overdue dispatches</h2><span class="count">${od.length}</span></header>${od.length?`<ul class="alist">${od.slice(0,6).map(d=>`<li><div><b class="mono">${d.id}</b><small>${esc(C.lname(d.from))} to ${esc(C.lname(d.to))}</small></div><span class="late">${Math.max(1,Math.round((C.TODAY-d.due)/864e5))} days late</span><button class="btn btn-ghost btn-sm" data-act="openCard" data-id="${d.id}">Open</button></li>`).join('')}</ul>`:`<div class="empty compact"><span class="empty-ic">${ic('check',22)}</span><h3>Nothing is overdue</h3></div>`}
    <header class="card-h sub"><h2>Running low in warehouses</h2></header><ul class="alist">${low.slice(0,4).map(x=>`<li><div><b>${x.i.name}</b><small>${esc(x.l.name)}</small></div><div class="bar low" role="img" aria-label="${Math.round(x.p*100)}% remaining"><i style="width:${Math.round(x.p*100)}%"></i></div><button class="btn btn-ghost btn-sm" data-act="newDispatch" data-from="${x.l.id}" title="Dispatch from this warehouse">Dispatch</button></li>`).join('')||'<li><small class="muted">All warehouse stock is above one third.</small></li>'}</ul></section>
   <section class="card month"><header class="card-h"><h2>This month</h2></header><ul class="mlist">${ks.map(k=>`<li><div><span>${k.label}</span><b>${k.value}</b><small>${k.note}</small></div>${C.spark(k.spark,k.c,110,40)}</li>`).join('')}</ul></section>
   <section class="card trendc"><header class="card-h"><h2>Dispatched and received</h2>${C.seg('range',[[12,'12 months'],[6,'6 months']])}</header><div class="card-b">${C.lineChart({...tt,area:false,label:'Dispatches sent and received by month'})}<ul class="legend">${tt.series.map(s=>`<li><i style="background:var(--${s.c})"></i>${s.name}</li>`).join('')}</ul></div></section>
   <section class="card flows"><header class="card-h"><h2>Where material flows</h2></header><ul class="flist">${fls.map(([k,v])=>`<li><span>${k}</span><div class="bar"><i style="width:${Math.round(v/fmax*100)}%"></i></div><b class="mono">${v}</b></li>`).join('')}</ul></section>
  </div>`}};
C.start();
})();

</script>
</body>
</html>
